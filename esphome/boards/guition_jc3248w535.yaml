# Guition JC3248W535: ESP32-S3, 16 MB flash, 8 MB PSRAM, 3.5" 320x480 IPS
# with an AXS15231B driver on quad SPI and capacitive touch in the same chip.
# The better board, and the one the kitchen profile is laid out for.
#
# Pins come from ESPHome's own JC3248W535 preset (mipi_spi) and its board
# definition: QSPI clock 47, data 21/48/40/39, CS 45; touch I2C SDA 4, SCL 8;
# backlight on GPIO1.
#
# Two quirks of the panel. It only draws reliably when LVGL redraws the whole
# frame (full_refresh), and it has no hardware rotation, so it runs in
# portrait. LVGL can rotate it in software: set rotation to 90 or 270 below
# and swap panel_width and panel_height. full_refresh means any change on
# screen, one changed digit included, sends the whole 320x480 frame at 16 bits
# (307,200 bytes) over QSPI, so the profiles only touch a label when its text
# changes.
#
# The speaker. The board has a two-pin speaker socket driven over I2S: bit
# clock GPIO42, word select GPIO2, data GPIO41, no master clock and no enable
# pin. ESPHome's JC3248W535 preset covers the display only; these three pins
# are what Guition's factory firmware passes to i2s_set_pin, and the same three
# appear in yoRadio's JC3248W535 pin file. Nobody names the amplifier chip, so
# whether it wants mono or stereo frames, and how loud it goes, is only known
# once a speaker is plugged in and the chime plays. See esphome/README.md.

substitutions:
  panel_width: "320"
  panel_height: "480"
  rotation: "0"
  font_small: "16"
  font_body: "20"
  font_big: "28"
  font_clock: "72"
  speaker_bclk_pin: "42"
  speaker_lrclk_pin: "2"
  speaker_dout_pin: "41"
  # mono or stereo; try stereo if the chime is silent or plays at half speed.
  speaker_channel: mono
  # 0% to 100%. The chime's loudness; the amp has no volume of its own.
  speaker_gain: 60%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: lcd_spi
    type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - id: touch_i2c
    sda: 4
    scl: 8
    frequency: 400kHz

output:
  - platform: ledc
    id: backlight_output
    pin: 1
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_output
    # Plain duty, see backlight_gamma in packages/base.yaml.
    gamma_correct: ${backlight_gamma}
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

display:
  - platform: mipi_spi
    id: panel_display
    model: JC3248W535
    spi_id: lcd_spi
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: axs15231
    id: panel_touch
    i2c_id: touch_i2c
    display: panel_display
    on_release:
      - script.execute: wake_screen

i2s_audio:
  - id: speaker_i2s
    i2s_bclk_pin: ${speaker_bclk_pin}
    i2s_lrclk_pin: ${speaker_lrclk_pin}

speaker:
  - platform: i2s_audio
    id: panel_speaker
    i2s_audio_id: speaker_i2s
    dac_type: external
    i2s_dout_pin: ${speaker_dout_pin}
    channel: ${speaker_channel}

# Plays RTTTL tunes on the speaker. packages/timers.yaml uses it for the
# timer chime; nothing plays unless a package asks.
rtttl:
  id: panel_chime
  speaker: panel_speaker
  gain: ${speaker_gain}

lvgl:
  full_refresh: true
  buffer_size: 100%
  rotation: ${rotation}
