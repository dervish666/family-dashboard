# Kitchen profile: the shared family view, in pages.
#
#   Home    the clock, the family announcement, the strip (bins, printer,
#           rain) and four preset announcements anyone in the kitchen can send
#   Today   the day's calendar, lunch and kit, and what is due soon
#
# packages/timers.yaml adds a Timers page and packages/light_tiles.yaml a
# Lights page; examples/kitchen.yaml uses all three. A row of page buttons
# along the bottom moves between them. There is no swipe: a swipe on a
# capacitive panel by the cooker reads too many splashes as gestures.
#
# Home Assistant does the formatting. The sensors come from
# homeassistant/panels.example.yaml (today, lunch and kit, due) and
# homeassistant/panels-kitchen.example.yaml (the strip, rain). Each one keeps
# a short state under the 255 characters a state can hold, and the full text
# in a `lines` attribute, newline separated, which is what this page reads.
#
# Sending a preset fires an esphome.family_panel_broadcast event. An
# automation in panels.example.yaml checks the message against its own list
# and only then calls the announce script, so this panel cannot post
# arbitrary text and needs no "allow actions" permission.
#
# The presets must match broadcast_presets in panels.example.yaml, word for
# word. No double quotes in them.

substitutions:
  today_entity: sensor.panel_today
  lunch_entity: sensor.panel_lunch_and_kit
  due_entity: sensor.panel_due
  strip_entity: sensor.panel_strip
  rain_entity: sensor.panel_rain
  # The most lines one card shows before "+N more".
  today_max_lines: "12"
  preset_1: "Dinner's ready"
  preset_2: "Shoes on, we're leaving"
  preset_3: "Come downstairs please"
  preset_4: "Bedtime in ten minutes"

globals:
  - id: pending_preset
    type: std::string
    initial_value: '""'

text_sensor:
  # Each card reads its sensor twice: the `lines` attribute for the text, and
  # the state to notice the sensor going unavailable. Home Assistant sends
  # nothing at all when an attribute disappears, so without the state an
  # unavailable sensor would leave yesterday's lines on the screen.
  - platform: homeassistant
    id: today_text
    entity_id: ${today_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 0 }
  - platform: homeassistant
    id: today_state
    entity_id: ${today_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 0 }
  - platform: homeassistant
    id: lunch_text
    entity_id: ${lunch_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 1 }
  - platform: homeassistant
    id: lunch_state
    entity_id: ${lunch_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 1 }
  - platform: homeassistant
    id: due_text
    entity_id: ${due_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 2 }
  - platform: homeassistant
    id: due_state
    entity_id: ${due_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 2 }
  - platform: homeassistant
    id: strip_text
    entity_id: ${strip_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 3 }
  - platform: homeassistant
    id: strip_state
    entity_id: ${strip_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 3 }
  - platform: homeassistant
    id: rain_text
    entity_id: ${rain_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 4 }

script:
  # Formats every card: names a missing source, and caps the lines so a busy
  # day cannot push the card off the screen. A label is only touched when its
  # text changes, because on the JC3248W535 every touch costs a full frame.
  - id: show_lines
    mode: queued
    max_runs: 12
    parameters:
      target: int
    then:
      - lambda: |-
          static const char *const NAMES[] = {"Calendar", "Lunch and kit", "Due times", "The strip", "Rain"};
          text_sensor::TextSensor *attr[] = {id(today_text), id(lunch_text), id(due_text), id(strip_text), id(rain_text)};
          text_sensor::TextSensor *st[] = {id(today_state), id(lunch_state), id(due_state), id(strip_state), id(rain_text)};
          lv_obj_t *labels[] = {id(today_label), id(lunch_label), id(due_label), id(strip_label), id(rain_label)};
          if (target < 0 || target > 4) return;
          std::string raw;
          const std::string &s0 = st[target]->state;
          if (st[target]->has_state() && (s0 == "unavailable" || s0 == "unknown")) raw = "unavailable";
          else if (attr[target]->has_state()) raw = attr[target]->state;
          else return;  // nothing heard yet: the card keeps "Waiting for Home Assistant"
          std::string what = NAMES[target];
          lv_obj_t *label = labels[target];
          int max_lines = target == 4 ? 2 : ${today_max_lines};
          std::string shown;
          // BEGIN panel-lines (tests/panels/check.py compiles this block)
          {
            auto trim = [](std::string v) {
              size_t a = v.find_first_not_of(" \t\r\n");
              if (a == std::string::npos) return std::string();
              size_t b = v.find_last_not_of(" \t\r\n");
              return v.substr(a, b - a + 1);
            };
            std::string s = trim(raw);
            // "None" is what Home Assistant sends for an attribute that is not
            // there, which is how an unavailable template sensor arrives.
            if (s.empty() || s == "None" || s == "unknown" || s == "unavailable") {
              shown = what + " unavailable";
            } else {
              std::vector<std::string> lines;
              size_t at = 0;
              while (true) {
                size_t nl = s.find('\n', at);
                std::string line = trim(s.substr(at, nl == std::string::npos ? std::string::npos : nl - at));
                if (!line.empty()) lines.push_back(line);
                if (nl == std::string::npos) break;
                at = nl + 1;
              }
              if (max_lines < 2) max_lines = 2;
              size_t keep = lines.size() > (size_t) max_lines ? (size_t) max_lines - 1 : lines.size();
              for (size_t i = 0; i < keep; i++) shown += (i ? "\n" : "") + lines[i];
              if (keep < lines.size()) shown += "\n+" + std::to_string(lines.size() - keep) + " more";
            }
          }
          // END panel-lines
          if (shown != lv_label_get_text(label)) lv_label_set_text(label, shown.c_str());

  - id: ask_preset
    parameters:
      message: std::string
    then:
      - lambda: id(pending_preset) = message;
      - lvgl.label.update:
          id: confirm_label
          text: !lambda return "Send to every panel?\n\n" + message;
      - lvgl.widget.show: confirm_box
      - lambda: lv_obj_move_foreground(id(confirm_box));

  - id: send_preset
    then:
      - if:
          condition: api.connected
          then:
            - homeassistant.event:
                event: esphome.family_panel_broadcast
                data:
                  message: !lambda return id(pending_preset);
            - lvgl.widget.hide: confirm_box
          else:
            - lvgl.label.update:
                id: confirm_label
                text: "Not connected to Home Assistant.\nNothing was sent."

lvgl:
  style_definitions:
    - id: nav_style
      bg_color: 0xFFFFFF
      text_color: 0x3F7A50
      radius: 0
      border_width: 0
      shadow_width: 0
      pad_all: 4
    - id: card_title_style
      text_font: font_small
      text_color: 0x3F7A50

  pages:
    - id: main_page
      bg_color: 0xFFF8EC
      pad_all: 8
      # Room for the page buttons, and for the timer chip above them.
      pad_bottom: 108
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      widgets:
        - obj:
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: clock_label
                  text: "--:--"
                  text_font: font_clock
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: end
                  widgets:
                    - label:
                        id: date_label
                        text: ""
                    - label:
                        id: offline_label
                        text: "offline"
                        text_font: font_small
                        text_color: 0xC9594A
                        hidden: true
        - obj:
            id: announce_box
            width: 100%
            height: SIZE_CONTENT
            styles: banner_style
            hidden: true
            widgets:
              - label:
                  id: announce_label
                  width: 100%
                  text: ""
                  text_font: font_big
                  long_mode: wrap
        # The strip: bins, the printer, and rain, one short line each.
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 4
            widgets:
              - label:
                  id: strip_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  long_mode: wrap
              - label:
                  id: rain_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  text_font: font_small
                  text_color: 0x3F6F8F
                  long_mode: wrap
        - obj:
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
        - obj:
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_between
              pad_row: 6
            widgets:
              - button:
                  width: 49%
                  height: SIZE_CONTENT
                  pad_all: 8
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_1}" }
                  widgets:
                    - label: { text: "${preset_1}", text_font: font_small, width: 100%, long_mode: wrap, text_align: CENTER }
              - button:
                  width: 49%
                  height: SIZE_CONTENT
                  pad_all: 8
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_2}" }
                  widgets:
                    - label: { text: "${preset_2}", text_font: font_small, width: 100%, long_mode: wrap, text_align: CENTER }
              - button:
                  width: 49%
                  height: SIZE_CONTENT
                  pad_all: 8
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_3}" }
                  widgets:
                    - label: { text: "${preset_3}", text_font: font_small, width: 100%, long_mode: wrap, text_align: CENTER }
              - button:
                  width: 49%
                  height: SIZE_CONTENT
                  pad_all: 8
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_4}" }
                  widgets:
                    - label: { text: "${preset_4}", text_font: font_small, width: 100%, long_mode: wrap, text_align: CENTER }

    - id: today_page
      bg_color: 0xFFF8EC
      pad_all: 8
      pad_bottom: 64
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      widgets:
        - label:
            text: "Today"
            text_font: font_big
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 2
            widgets:
              - label: { text: "Calendar", styles: card_title_style }
              - label:
                  id: today_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  long_mode: wrap
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 2
            widgets:
              - label: { text: "Lunch and kit", styles: card_title_style }
              - label:
                  id: lunch_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  long_mode: wrap
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 2
            widgets:
              - label: { text: "Due", styles: card_title_style }
              - label:
                  id: due_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  long_mode: wrap

  top_layer:
    widgets:
      # The page buttons. Four slots of a quarter each: Home and Today here,
      # Timers (packages/timers.yaml) and Lights (packages/light_tiles.yaml)
      # bring their own, so a kitchen without them has an empty slot, not a
      # button to nowhere.
      - obj:
          align: BOTTOM_MID
          width: 100%
          height: 56
          bg_color: 0xFFFFFF
          border_width: 2
          border_side: TOP
          border_color: 0xE8DCC4
          clickable: false
          scrollable: false
      - button:
          align: BOTTOM_LEFT
          x: 0
          width: 25%
          height: 54
          styles: nav_style
          on_click:
            - lvgl.page.show: main_page
          widgets:
            - label: { text: "Home", align: CENTER }
      - button:
          align: BOTTOM_LEFT
          x: 25%
          width: 25%
          height: 54
          styles: nav_style
          on_click:
            - lvgl.page.show: today_page
          widgets:
            - label: { text: "Today", align: CENTER }

      # The confirm step, above whatever page is showing. A stray elbow on a
      # preset button asks first instead of shouting at the whole house.
      - obj:
          id: confirm_box
          hidden: true
          align: CENTER
          width: 90%
          height: SIZE_CONTENT
          styles: card_style
          border_color: 0x3F7A50
          border_width: 3
          shadow_width: 24
          shadow_opa: 40%
          layout:
            type: flex
            flex_flow: column
            flex_align_cross: center
            pad_row: 10
          widgets:
            - label:
                id: confirm_label
                width: 100%
                text: ""
                text_align: CENTER
                long_mode: wrap
            - obj:
                width: 100%
                height: SIZE_CONTENT
                bg_opa: TRANSP
                layout:
                  type: flex
                  flex_flow: row
                  flex_align_main: space_between
                widgets:
                  - button:
                      width: 47%
                      height: SIZE_CONTENT
                      pad_all: 10
                      bg_color: 0xB9B4AA
                      on_click:
                        - lvgl.widget.hide: confirm_box
                      widgets:
                        - label: { text: "Cancel", align: CENTER }
                  - button:
                      width: 47%
                      height: SIZE_CONTENT
                      pad_all: 10
                      on_click:
                        - script.execute: send_preset
                      widgets:
                        - label: { text: "Send", align: CENTER }
