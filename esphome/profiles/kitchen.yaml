# Kitchen profile: the shared family view, in pages.
#
#   Home      the clock and date, the family announcement, the strip (bins,
#             printer, rain) and, with packages/light_tiles.yaml, the room
#             tiles and All off. The panel boots to it and goes back to it
#             after idle_timeout.
#   Today     the day's calendar, lunch and kit, and what is due soon
#   Announce  four preset announcements anyone in the kitchen can send
#
# packages/timers.yaml adds a Timers page, the chime (louder each repeat,
# timer_volume and timer_escalate) and a Test alarm button that plays the
# ring without a timer. A row of page buttons along the
# bottom moves between them, Home, Today, Timers, Announce, with the page on
# the screen marked. There is no swipe: a swipe on a capacitive panel by the
# cooker reads too many splashes as gestures.
#
# Laid out for the JC3248W535's 320x480 portrait screen on an 8 px grid: 8 px
# margins, 8 px gutters, two columns of 148 px. tests/panels/host/render.sh
# draws every page on a development machine to check it.
#
# Home Assistant does the formatting. The sensors come from
# homeassistant/panels.example.yaml (today, lunch and kit, due) and
# homeassistant/panels-kitchen.example.yaml (the strip, rain). Each one keeps
# a short state under the 255 characters a state can hold, and the full text
# in a `lines` attribute, newline separated, which is what this page reads.
#
# Sending a preset fires an esphome.family_panel_broadcast event. An
# automation in panels.example.yaml checks the message against its own list
# and only then calls the announce script, so this panel cannot post
# arbitrary text and needs no "allow actions" permission.
#
# The presets must match broadcast_presets in panels.example.yaml, word for
# word. No double quotes in them.

substitutions:
  today_entity: sensor.panel_today
  lunch_entity: sensor.panel_lunch_and_kit
  due_entity: sensor.panel_due
  strip_entity: sensor.panel_strip
  rain_entity: sensor.panel_rain
  # The most lines one card shows before "+N more".
  today_max_lines: "12"
  # The Home page clock, smaller than a kid panel's so the tiles get the room.
  font_header: "44"
  preset_1: "Dinner's ready"
  preset_2: "Shoes on, we're leaving"
  preset_3: "Come downstairs please"
  preset_4: "Bedtime in ten minutes"

globals:
  - id: pending_preset
    type: std::string
    initial_value: '""'

font:
  - file: "gfonts://Nunito@800"
    id: font_header
    size: ${font_header}
    bpp: 4
    glyphs: "0123456789:"

text_sensor:
  # Each card reads its sensor twice: the `lines` attribute for the text, and
  # the state to notice the sensor going unavailable. Home Assistant sends
  # nothing at all when an attribute disappears, so without the state an
  # unavailable sensor would leave yesterday's lines on the screen.
  - platform: homeassistant
    id: today_text
    entity_id: ${today_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 0 }
  - platform: homeassistant
    id: today_state
    entity_id: ${today_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 0 }
  - platform: homeassistant
    id: lunch_text
    entity_id: ${lunch_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 1 }
  - platform: homeassistant
    id: lunch_state
    entity_id: ${lunch_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 1 }
  - platform: homeassistant
    id: due_text
    entity_id: ${due_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 2 }
  - platform: homeassistant
    id: due_state
    entity_id: ${due_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 2 }
  - platform: homeassistant
    id: strip_text
    entity_id: ${strip_entity}
    attribute: lines
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 3 }
  - platform: homeassistant
    id: strip_state
    entity_id: ${strip_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 3 }
  - platform: homeassistant
    id: rain_text
    entity_id: ${rain_entity}
    internal: true
    on_value:
      - script.execute: { id: show_lines, target: 4 }

script:
  # Formats every card: names a missing source, and caps the lines so a busy
  # day cannot push the card off the screen. A label is only touched when its
  # text changes, because on the JC3248W535 every touch costs a full frame.
  - id: show_lines
    mode: queued
    max_runs: 12
    parameters:
      target: int
    then:
      - lambda: |-
          static const char *const NAMES[] = {"Calendar", "Lunch and kit", "Due times", "The strip", "Rain"};
          text_sensor::TextSensor *attr[] = {id(today_text), id(lunch_text), id(due_text), id(strip_text), id(rain_text)};
          text_sensor::TextSensor *st[] = {id(today_state), id(lunch_state), id(due_state), id(strip_state), id(rain_text)};
          lv_obj_t *labels[] = {id(today_label), id(lunch_label), id(due_label), id(strip_label), id(rain_label)};
          if (target < 0 || target > 4) return;
          bool state_heard = st[target]->has_state(), lines_heard = attr[target]->has_state();
          std::string state = st[target]->state, raw = attr[target]->state;
          std::string what = NAMES[target];
          lv_obj_t *label = labels[target];
          int max_lines = target == 4 ? 2 : ${today_max_lines};
          std::string shown;
          bool wait = false;
          // BEGIN panel-lines (tests/panels/check.py compiles this block)
          {
            auto trim = [](std::string v) {
              size_t a = v.find_first_not_of(" \t\r\n");
              if (a == std::string::npos) return std::string();
              size_t b = v.find_last_not_of(" \t\r\n");
              return v.substr(a, b - a + 1);
            };
            // An unavailable sensor loses its attributes, and Home Assistant
            // sends nothing for a missing attribute, so the old lines would
            // stay. The state is what says the sensor has gone.
            if (state_heard && (state == "unavailable" || state == "unknown")) raw = "unavailable";
            else if (!lines_heard) wait = true;  // keeps "Waiting for Home Assistant"
            std::string s = trim(raw);
            // An attribute holding None arrives as the text "None".
            if (wait) {
            } else if (s.empty() || s == "None" || s == "unknown" || s == "unavailable") {
              shown = what + " unavailable";
            } else {
              std::vector<std::string> lines;
              size_t at = 0;
              while (true) {
                size_t nl = s.find('\n', at);
                std::string line = trim(s.substr(at, nl == std::string::npos ? std::string::npos : nl - at));
                if (!line.empty()) lines.push_back(line);
                if (nl == std::string::npos) break;
                at = nl + 1;
              }
              if (max_lines < 2) max_lines = 2;
              size_t keep = lines.size() > (size_t) max_lines ? (size_t) max_lines - 1 : lines.size();
              for (size_t i = 0; i < keep; i++) shown += (i ? "\n" : "") + lines[i];
              if (keep < lines.size()) shown += "\n+" + std::to_string(lines.size() - keep) + " more";
            }
          }
          // END panel-lines
          if (wait) return;
          if (shown != lv_label_get_text(label)) lv_label_set_text(label, shown.c_str());

  # Marks the page button for the page that just loaded, by slot (0 Home, 1
  # Today, 2 Timers, 3 Announce): every 44 px button in the top layer loses
  # its checked state except the one at that slot's x. The buttons come from
  # more than one package, so this walks the layer instead of naming them,
  # and the timer chip (36 px, top right) never matches.
  - id: nav_mark
    parameters:
      slot: int
    then:
      - lambda: |-
          lv_obj_t *top = lv_layer_top();
          uint32_t n = lv_obj_get_child_cnt(top);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(top, i);
            if (!lv_obj_check_type(c, &lv_button_class) || lv_obj_get_height(c) != 44) continue;
            if (lv_obj_get_x(c) == 4 + 80 * slot) lv_obj_add_state(c, LV_STATE_CHECKED);
            else lv_obj_remove_state(c, LV_STATE_CHECKED);
          }

  - id: ask_preset
    parameters:
      message: std::string
    then:
      - lambda: id(pending_preset) = message;
      - lvgl.label.update:
          id: confirm_label
          text: !lambda return "Send to every panel?\n\n" + message;
      - lvgl.widget.show: confirm_box
      - lambda: lv_obj_move_foreground(id(confirm_box));

  - id: send_preset
    then:
      - if:
          condition: api.connected
          then:
            - homeassistant.event:
                event: esphome.family_panel_broadcast
                data:
                  message: !lambda return id(pending_preset);
            - lvgl.widget.hide: confirm_box
          else:
            - lvgl.label.update:
                id: confirm_label
                text: "Not connected to Home Assistant.\nNothing was sent."

lvgl:
  on_idle:
    # Back to Home, and drop an unanswered confirm, once nobody is touching
    # the panel. The backlight step is in packages/base.yaml.
    - timeout: ${idle_timeout}
      then:
        - lvgl.widget.hide: confirm_box
        - lvgl.page.show: main_page

  style_definitions:
    # A page button: quiet until its page is showing, then a warm pill.
    - id: nav_style
      bg_color: 0xFFFFFF
      text_color: 0x7A7366
      text_font: font_small
      radius: 12
      border_width: 0
      shadow_width: 0
      pad_all: 0
    - id: nav_checked_style
      bg_color: 0xFCE7B2
      text_color: 0x3A2606
    - id: page_title_style
      text_font: font_big
      text_color: 0x2E2A24
    # A preset: a big green button with the words centred.
    - id: preset_style
      bg_color: 0x3F7A50
      text_color: 0xFFFFFF
      radius: 16
      pad_all: 10

  pages:
    # Home. A flex column: the header row, the announcement when there is
    # one, the strip card, then whatever packages/light_tiles.yaml appends
    # (the tiles and All off). pad_bottom keeps it above the page buttons.
    - id: main_page
      bg_color: 0xFFF8EC
      pad_all: 8
      pad_bottom: 64
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      on_load:
        - script.execute: { id: nav_mark, slot: 0 }
      widgets:
        - obj:
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: clock_label
                  text: "--:--"
                  text_font: font_header
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: end
                  widgets:
                    - label:
                        id: date_label
                        text: ""
                        text_color: 0x7A7366
                    - label:
                        id: offline_label
                        text: "offline"
                        text_font: font_small
                        text_color: 0xC9594A
                        hidden: true
        - obj:
            id: announce_box
            width: 100%
            height: SIZE_CONTENT
            styles: banner_style
            hidden: true
            widgets:
              - label:
                  id: announce_label
                  width: 100%
                  text: ""
                  text_font: font_body
                  long_mode: wrap
        # The strip: bins, the printer, and rain, one short line each. A tap
        # opens Today.
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            pad_all: 10
            clickable: true
            on_click:
              - lvgl.page.show: today_page
            layout:
              type: flex
              flex_flow: column
              pad_row: 2
            widgets:
              - label:
                  id: strip_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  long_mode: wrap
              - label:
                  id: rain_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  text_font: font_small
                  text_color: 0x3F6F8F
                  long_mode: wrap

    - id: today_page
      bg_color: 0xFFF8EC
      pad_all: 8
      pad_bottom: 64
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      on_load:
        - script.execute: { id: nav_mark, slot: 1 }
      widgets:
        - label:
            text: "Today"
            styles: page_title_style
            height: 36
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 6
            widgets:
              - label: { text: "Calendar", styles: section_style }
              - label:
                  id: today_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  text_line_space: 4
                  long_mode: wrap
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 6
            widgets:
              - label: { text: "Lunch and kit", styles: section_style }
              - label:
                  id: lunch_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  text_line_space: 4
                  long_mode: wrap
        - obj:
            width: 100%
            height: SIZE_CONTENT
            styles: card_style
            layout:
              type: flex
              flex_flow: column
              pad_row: 6
            widgets:
              - label: { text: "Due", styles: section_style }
              - label:
                  id: due_label
                  width: 100%
                  text: "Waiting for Home Assistant"
                  text_line_space: 4
                  long_mode: wrap

    # Announce: the four presets, two by two.
    - id: announce_page
      bg_color: 0xFFF8EC
      pad_all: 8
      pad_bottom: 64
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      on_load:
        - script.execute: { id: nav_mark, slot: 3 }
      widgets:
        - label:
            text: "Announce"
            styles: page_title_style
            height: 36
        - label:
            text: "Says it on every panel and speaker"
            styles: section_style
        - obj:
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            layout:
              type: flex
              flex_flow: row_wrap
              pad_row: 8
              pad_column: 8
            widgets:
              - button:
                  width: 148
                  height: 120
                  styles: preset_style
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_1}" }
                  widgets:
                    - label: { text: "${preset_1}", width: 100%, long_mode: wrap, text_align: CENTER, align: CENTER }
              - button:
                  width: 148
                  height: 120
                  styles: preset_style
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_2}" }
                  widgets:
                    - label: { text: "${preset_2}", width: 100%, long_mode: wrap, text_align: CENTER, align: CENTER }
              - button:
                  width: 148
                  height: 120
                  styles: preset_style
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_3}" }
                  widgets:
                    - label: { text: "${preset_3}", width: 100%, long_mode: wrap, text_align: CENTER, align: CENTER }
              - button:
                  width: 148
                  height: 120
                  styles: preset_style
                  on_click:
                    - script.execute: { id: ask_preset, message: "${preset_4}" }
                  widgets:
                    - label: { text: "${preset_4}", width: 100%, long_mode: wrap, text_align: CENTER, align: CENTER }

  top_layer:
    widgets:
      # The page buttons: a 56 px bar with four 72x44 pills, one per quarter.
      # Home, Today and Announce are here; Timers (packages/timers.yaml)
      # brings its own for the third slot, so a kitchen without timers has an
      # empty slot, not a button to nowhere.
      - obj:
          align: BOTTOM_MID
          width: 100%
          height: 56
          bg_color: 0xFFFFFF
          border_width: 2
          border_side: TOP
          border_color: 0xE8DCC4
          clickable: false
          scrollable: false
      - button:
          id: nav_home
          align: BOTTOM_LEFT
          x: 4
          y: -6
          width: 72
          height: 44
          styles: nav_style
          checked:
            styles: nav_checked_style
          on_click:
            - lvgl.page.show: main_page
          widgets:
            - label: { text: "Home", align: CENTER }
      - button:
          id: nav_today
          align: BOTTOM_LEFT
          x: 84
          y: -6
          width: 72
          height: 44
          styles: nav_style
          checked:
            styles: nav_checked_style
          on_click:
            - lvgl.page.show: today_page
          widgets:
            - label: { text: "Today", align: CENTER }
      - button:
          id: nav_announce
          align: BOTTOM_LEFT
          x: 244
          y: -6
          width: 72
          height: 44
          styles: nav_style
          checked:
            styles: nav_checked_style
          on_click:
            - lvgl.page.show: announce_page
          widgets:
            - label: { text: "Announce", align: CENTER }

      # The confirm step, above whatever page is showing. A stray elbow on a
      # preset button asks first instead of shouting at the whole house.
      - obj:
          id: confirm_box
          hidden: true
          align: CENTER
          width: 288
          height: SIZE_CONTENT
          styles: card_style
          pad_all: 16
          border_color: 0x3F7A50
          border_width: 3
          shadow_width: 24
          shadow_opa: 40%
          layout:
            type: flex
            flex_flow: column
            flex_align_cross: center
            pad_row: 16
          widgets:
            - label:
                id: confirm_label
                width: 100%
                text: ""
                text_align: CENTER
                long_mode: wrap
            - obj:
                width: 100%
                height: SIZE_CONTENT
                bg_opa: TRANSP
                layout:
                  type: flex
                  flex_flow: row
                  flex_align_main: space_between
                widgets:
                  - button:
                      width: 124
                      height: 48
                      bg_color: 0xB9B4AA
                      on_click:
                        - lvgl.widget.hide: confirm_box
                      widgets:
                        - label: { text: "Cancel", align: CENTER }
                  - button:
                      width: 124
                      height: 48
                      on_click:
                        - script.execute: send_preset
                      widgets:
                        - label: { text: "Send", align: CENTER }
