# Three kitchen timers that run on the panel itself.
#
# A Timers page with three cards: +1, +5 and +10 add minutes (to the set time
# while a timer is stopped, to the time left while it runs), Go starts it and
# Stop stops it. Tap a stopped timer's time to clear it. While any timer runs,
# a chip in the top right corner of the other pages shows the time left in
# minutes; tap it for the Timers page.
#
# When a timer ends the panel:
#   1. shows a full-width "Timer done" card with the timer's name and a
#      Dismiss button, over whatever page is showing, and lights the screen;
#   2. plays the chime on its own speaker, again every timer_chime_every,
#      until Dismiss or timer_ring_seconds after the end (2 minutes). The
#      first chime is at timer_volume; with timer_escalate each repeat is a
#      step louder, up to timer_volume_max after timer_escalate_seconds;
#   3. fires esphome.family_panel_timer_done with the timer's name, once, so
#      an automation in homeassistant/panels-kitchen.example.yaml can say it
#      on the house speakers. The panel never calls a Home Assistant action.
#
# End times are kept in flash (as Unix seconds), so a timer survives a reboot
# or a power cut. Coming back up, a timer that ended in the last 2 minutes
# rings as normal; one that ended longer ago shows its card quietly, with no
# chime and nothing sent to Home Assistant; one that ended more than six hours
# ago is forgotten. Until the clock is set from Home Assistant a running timer
# shows --:-- and keeps its end time.
#
# The screen cost. The JC3248W535 redraws its whole frame (307,200 bytes) for
# any change, so the panel only touches the time labels once a second while
# the Timers page is on the screen. On every other page the chip changes once
# a minute, when its text changes. The done card does not count down.
#
# To hear the level without waiting for a timer: press the panel's "Test
# alarm" button in Home Assistant, or hold the first timer's name on the
# Timers page. It plays the ring as a timer would (every timer_chime_every,
# getting louder), stops after timer_escalate_seconds, and stops at once on
# a second press or hold. It shows no card and tells Home Assistant nothing.
#
# Needs a board with a speaker and an rtttl player called panel_chime: only
# boards/guition_jc3248w535.yaml has one. Needs the kitchen profile, whose
# page buttons this joins (the third slot). Three cards of 130 px fill the
# 320x480 screen above the page buttons, each with a row of four 64x44
# buttons.

substitutions:
  timer_1_name: "Timer 1"
  timer_2_name: "Timer 2"
  timer_3_name: "Timer 3"
  # RTTTL: name, then d (default note length), o (octave), b (tempo).
  timer_chime: "done:d=8,o=6,b=180:c,e,g,2c7"
  timer_chime_every: "5"
  timer_ring_seconds: "120"
  # How loud the chime is, 0.0 to 1.0, on ESPHome's speaker volume scale. It
  # is not a straight share of full scale: ESPHome 2026.10 maps 0.0 to 1.0
  # onto -49 dB to 0 dB, so each 0.1 is 4.9 dB. 1.0 is a full-scale sine
  # (the loudest the samples go without clipping), 0.85 is -7.4 dB
  # (0.43 of full scale), 0.75 is -12 dB (0.25, the old Arduino firmware's
  # level) and 0.6, rtttl's own default, is -19.6 dB (0.10).
  timer_volume: "0.85"
  # With timer_escalate, each repeat steps up from timer_volume until it
  # reaches timer_volume_max timer_escalate_seconds after the first chime.
  # "false" plays every chime at timer_volume.
  timer_escalate: "true"
  timer_volume_max: "1.0"
  timer_escalate_seconds: "30"
  font_timer: "40"

preferences:
  # How long a changed end time waits before it is written to flash. The
  # default is a minute; a timer started and then lost in a power cut inside
  # that minute would be gone. The timers write only when started, changed
  # or stopped.
  flash_write_interval: 10s

globals:
  # When each timer ends, in Unix seconds; 0 is stopped. Kept in flash.
  - id: timer_1_end
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: timer_2_end
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: timer_3_end
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # The minutes a stopped timer will run for when Go is pressed.
  - id: timer_set
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
  # 0 stopped, 1 running, 2 ringing, 3 done quietly (see timer-step).
  - id: timer_phase
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
  - id: timer_left
    type: std::array<uint32_t, 3>
    initial_value: "{0, 0, 0}"
  # The done card has been shown (and the event sent, if ringing) for this end.
  - id: timer_fired
    type: std::array<bool, 3>
    initial_value: "{false, false, false}"
  # The event could not be sent (Home Assistant away); send it on reconnect.
  - id: timer_unsent
    type: std::array<bool, 3>
    initial_value: "{false, false, false}"
  # Which timer the done card shows, -1 for none.
  - id: timer_done_slot
    type: int
    initial_value: "-1"
  - id: timer_last_chime
    type: uint32_t
    initial_value: "0"
  # How many chimes this ring has played, for the escalation.
  - id: timer_chime_count
    type: int
    initial_value: "0"

font:
  - file: "gfonts://Nunito@800"
    id: font_timer
    size: ${font_timer}
    bpp: 4
    glyphs: "0123456789:-"

interval:
  - interval: 1s
    then:
      - script.execute: timer_tick

script:
  # Once a second: works out each timer's phase, starts the done card and the
  # event, plays the chime, and redraws only what the screen is showing.
  - id: timer_tick
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          uint32_t now = t.is_valid() ? (uint32_t) t.timestamp : 0;
          uint32_t *ends[3] = {&id(timer_1_end), &id(timer_2_end), &id(timer_3_end)};
          int ring = ${timer_ring_seconds};
          for (int i = 0; i < 3; i++) {
            uint32_t end = *ends[i];
            int phase = 0;
            uint32_t left = 0;
            // BEGIN timer-step (tests/panels/check.py compiles this block)
            {
              const uint32_t forget = 6 * 3600;
              if (end == 0) phase = 0;              // stopped
              else if (now == 0) phase = 1;         // no clock yet: keep it, show --:--
              else if (now < end) { phase = 1; left = end - now; }
              else if (now - end < (uint32_t) ring) phase = 2;   // ringing
              else if (now - end < forget) phase = 3;            // done, quietly
              else phase = 4;                                    // long gone: forget it
            }
            // END timer-step
            if (phase == 4) {
              ESP_LOGI("timers", "Timer %d ended over six hours ago; cleared", i + 1);
              *ends[i] = 0;
              phase = 0;
            }
            if (phase == 0 || phase == 1) id(timer_fired)[i] = false;
            if ((phase == 2 || phase == 3) && !id(timer_fired)[i]) {
              id(timer_fired)[i] = true;
              if (phase == 2) id(timer_announce).execute(i);
              else ESP_LOGI("timers", "Timer %d ended while the panel was off", i + 1);
            }
            id(timer_phase)[i] = phase;
            id(timer_left)[i] = left;
          }
          // The done card: keep the one showing until it is dismissed, then
          // move to the next timer that has ended, if any.
          int shown = id(timer_done_slot);
          if (shown >= 0 && id(timer_phase)[shown] < 2) shown = -1;
          if (shown < 0)
            for (int i = 0; i < 3; i++)
              if (id(timer_phase)[i] >= 2) { shown = i; break; }
          if (shown != id(timer_done_slot)) {
            id(timer_done_slot) = shown;
            if (shown < 0) {
              lv_obj_add_flag(id(timer_done_box), LV_OBJ_FLAG_HIDDEN);
              id(panel_chime).stop();
            } else {
              static const char *const NAMES[] = {"${timer_1_name}", "${timer_2_name}", "${timer_3_name}"};
              lv_label_set_text(id(timer_done_name), NAMES[shown]);
              ESPTime at = ESPTime::from_epoch_local(*ends[shown]);
              std::string when = *ends[shown] ? "Finished at " + at.strftime("%H:%M") : std::string("");
              lv_label_set_text(id(timer_done_when), when.c_str());
              lv_obj_clear_flag(id(timer_done_box), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(timer_done_box));
              id(timer_last_chime) = 0;
              id(timer_chime_count) = 0;
              // A real timer wins over the test ring.
              id(timer_test).stop();
              id(wake_screen).execute();
            }
          }
          // The chime repeats while the shown timer is still ringing.
          if (shown >= 0 && id(timer_phase)[shown] == 2 && now &&
              now - id(timer_last_chime) >= (uint32_t) ${timer_chime_every} && !id(panel_chime).is_playing()) {
            id(timer_last_chime) = now;
            id(timer_chime_play).execute(id(timer_chime_count)++);
            // Keeps the screen lit while it rings, night or day.
            id(wake_screen).execute();
          } else if (shown >= 0 && id(timer_phase)[shown] == 3 && id(panel_chime).is_playing()) {
            id(panel_chime).stop();
          }
      - script.execute: timer_show

  # Redraws the Timers page rows when it is on screen, and the chip when it
  # is not. Each label is set only when its text changes.
  - id: timer_show
    then:
      - lambda: |-
          auto set_if = [](lv_obj_t *label, const std::string &s) {
            if (s != lv_label_get_text(label)) lv_label_set_text(label, s.c_str());
          };
          static const char *const NAMES[] = {"${timer_1_name}", "${timer_2_name}", "${timer_3_name}"};
          lv_obj_t *times[] = {id(timer_1_time), id(timer_2_time), id(timer_3_time)};
          lv_obj_t *gos[] = {id(timer_1_go_label), id(timer_2_go_label), id(timer_3_go_label)};
          lv_obj_t *go_btns[] = {id(timer_1_go), id(timer_2_go), id(timer_3_go)};
          auto t = id(ha_time).now();
          bool clock = t.is_valid();
          bool on_page = lv_scr_act() == id(timers_page)->obj;
          std::string chip;
          for (int i = 0; i < 3; i++) {
            int phase = id(timer_phase)[i];
            uint32_t secs = phase == 1 ? id(timer_left)[i] : (uint32_t) id(timer_set)[i] * 60;
            std::string full, brief;
            // BEGIN timer-format (tests/panels/check.py compiles this block)
            {
              char buf[16];
              unsigned h = secs / 3600, m = (secs % 3600) / 60, s = secs % 60;
              if (h) snprintf(buf, sizeof buf, "%u:%02u:%02u", h, m, s);
              else snprintf(buf, sizeof buf, "%u:%02u", m, s);
              full = buf;
              // Whole minutes, rounded up, so the chip never says 0 min while
              // a timer is still running.
              unsigned mins = (secs + 59) / 60;
              if (mins >= 60) snprintf(buf, sizeof buf, "%uh %02u", mins / 60, mins % 60);
              else snprintf(buf, sizeof buf, "%u min", mins);
              brief = buf;
            }
            // END timer-format
            if (phase == 1 && !clock) { full = "--:--"; brief = "--"; }
            if (on_page) {
              set_if(times[i], phase >= 2 ? std::string("0:00") : full);
              set_if(gos[i], phase == 0 ? std::string("Go") : phase == 1 ? std::string("Stop") : std::string("Done"));
              // Green to go, red to stop, amber once it has rung. Set only on
              // a change: every style write is a full frame on this board.
              lv_color_t want = lv_color_hex(phase == 0 ? 0x3F7A50 : phase == 1 ? 0xC9594A : 0xE0932A);
              if (!lv_color_eq(lv_obj_get_style_bg_color(go_btns[i], LV_PART_MAIN), want))
                lv_obj_set_style_bg_color(go_btns[i], want, LV_PART_MAIN);
            }
            if (phase == 1) chip += (chip.empty() ? "" : "   ") + std::string(NAMES[i]) + " " + brief;
          }
          lv_obj_t *box = id(timer_chip);
          if (chip.empty() || on_page) {
            lv_obj_add_flag(box, LV_OBJ_FLAG_HIDDEN);
          } else {
            set_if(id(timer_chip_label), chip);
            lv_obj_clear_flag(box, LV_OBJ_FLAG_HIDDEN);
          }

  - id: timer_add
    parameters:
      slot: int
      minutes: int
    then:
      - lambda: |-
          uint32_t *ends[3] = {&id(timer_1_end), &id(timer_2_end), &id(timer_3_end)};
          if (slot < 0 || slot > 2) return;
          if (id(timer_phase)[slot] == 1 && *ends[slot]) {
            // Running: add to the time left, up to ten hours from now.
            auto t = id(ha_time).now();
            uint32_t cap = t.is_valid() ? (uint32_t) t.timestamp + 600 * 60 : UINT32_MAX;
            uint32_t end = *ends[slot] + (uint32_t) minutes * 60;
            *ends[slot] = end > cap ? cap : end;
          } else if (id(timer_phase)[slot] == 0) {
            int m = id(timer_set)[slot] + minutes;
            id(timer_set)[slot] = m > 600 ? 600 : m;
          }
      - script.execute: timer_tick

  # Go on a stopped timer, Stop on a running one, Done on a finished one.
  - id: timer_go
    parameters:
      slot: int
    then:
      - lambda: |-
          uint32_t *ends[3] = {&id(timer_1_end), &id(timer_2_end), &id(timer_3_end)};
          if (slot < 0 || slot > 2) return;
          auto t = id(ha_time).now();
          if (id(timer_phase)[slot] != 0 || *ends[slot]) {
            *ends[slot] = 0;
          } else if (id(timer_set)[slot] > 0 && t.is_valid()) {
            *ends[slot] = (uint32_t) t.timestamp + (uint32_t) id(timer_set)[slot] * 60;
          }
      - script.execute: timer_tick

  - id: timer_clear_set
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot >= 0 && slot <= 2 && id(timer_phase)[slot] == 0) id(timer_set)[slot] = 0;
      - script.execute: timer_tick

  - id: timer_dismiss
    then:
      - lambda: |-
          uint32_t *ends[3] = {&id(timer_1_end), &id(timer_2_end), &id(timer_3_end)};
          int slot = id(timer_done_slot);
          id(panel_chime).stop();
          if (slot >= 0) *ends[slot] = 0;
      - script.stop: timer_test
      - script.execute: timer_tick

  # Plays the chime once, as chime number n of a ring (0 is the first), at
  # the volume that chime gets.
  - id: timer_chime_play
    parameters:
      n: int
    then:
      - lambda: |-
          const float base = ${timer_volume}, top = ${timer_volume_max};
          const int every = ${timer_chime_every}, span = ${timer_escalate_seconds};
          const bool escalate = ${timer_escalate};
          float volume = base;
          // BEGIN chime-volume (tests/panels/check.py compiles this block)
          {
            // Chime n starts about n * every seconds into the ring.
            if (escalate && span > 0 && top > base && n > 0) {
              float k = (float) n * (float) every / (float) span;
              if (k > 1.0f) k = 1.0f;
              volume = base + (top - base) * k;
            }
            if (volume < 0.0f) volume = 0.0f;
            if (volume > 1.0f) volume = 1.0f;
          }
          // END chime-volume
          ESP_LOGI("timers", "Chime %d at volume %.3f", n + 1, volume);
          id(panel_chime).set_gain(volume);
          id(panel_chime).play(std::string("${timer_chime}"));

  # The test ring: what a timer sounds like, with no card and no event. One
  # chime per timer_chime_every until the escalation tops out (two chimes
  # without it). A real timer ending, Dismiss or a second press stops it.
  - id: timer_test
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              int s = id(timer_done_slot);
              return s >= 0 && id(timer_phase)[s] == 2;
          then:
            - logger.log: "Test alarm skipped: a timer is ringing"
          else:
            - repeat:
                count: !lambda |-
                  const int every = ${timer_chime_every}, span = ${timer_escalate_seconds};
                  const bool escalate = ${timer_escalate};
                  if (!escalate || every <= 0 || span <= 0) return 2u;
                  return (uint32_t) ((span + every - 1) / every + 1);
                then:
                  - wait_until:
                      condition:
                        lambda: return !id(panel_chime).is_playing();
                      timeout: 3s
                  - script.execute:
                      id: timer_chime_play
                      n: !lambda return (int) iteration;
                  - delay: ${timer_chime_every}s

  # The Test alarm button and the hold on the Timers page: start the test
  # ring, or stop it if it is playing.
  - id: timer_test_toggle
    then:
      - if:
          condition:
            script.is_running: timer_test
          then:
            - script.stop: timer_test
            - lambda: |-
                int s = id(timer_done_slot);
                if (!(s >= 0 && id(timer_phase)[s] == 2)) id(panel_chime).stop();
          else:
            - script.execute: timer_test

  # Tells Home Assistant a timer ended. Sent once; if Home Assistant is away
  # it waits for the reconnect, and is dropped once the timer stops ringing.
  - id: timer_announce
    mode: queued
    parameters:
      slot: int
    then:
      - if:
          condition: api.connected
          then:
            - lambda: id(timer_unsent)[slot] = false;
            - homeassistant.event:
                event: esphome.family_panel_timer_done
                data:
                  timer: !lambda |-
                    static const char *const NAMES[] = {"${timer_1_name}", "${timer_2_name}", "${timer_3_name}"};
                    return std::string(NAMES[slot]);
                  slot: !lambda return std::to_string(slot + 1);
                  panel: ${name}
          else:
            - lambda: id(timer_unsent)[slot] = true;

  - id: !extend resend_pending
    then:
      - lambda: |-
          for (int i = 0; i < 3; i++)
            if (id(timer_unsent)[i] && id(timer_phase)[i] == 2) id(timer_announce).execute(i);
            else id(timer_unsent)[i] = false;

button:
  # Plays the test ring, or stops it. In Home Assistant it is on the panel's
  # device page, under Configuration.
  - platform: template
    id: timer_test_button
    name: Test alarm
    icon: mdi:alarm-bell
    entity_category: config
    on_press:
      - script.execute: timer_test_toggle

lvgl:
  style_definitions:
    # +1, +5, +10: sand with dark figures, so Go and Stop stand out.
    - id: add_style
      bg_color: 0xF3E9D2
      text_color: 0x2E2A24
      radius: 12

  pages:
    - id: timers_page
      bg_color: 0xFFF8EC
      pad_all: 8
      pad_bottom: 64
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      on_load:
        - script.execute: { id: nav_mark, slot: 2 }
        - script.execute: timer_show
      # One card per timer. YAML has no loops, so the three are written out;
      # they differ only in the number.
      widgets:
        - obj:
            width: 100%
            height: 130
            styles: card_style
            pad_all: 10
            scrollable: false
            layout: { type: flex, flex_flow: column, pad_row: 6 }
            widgets:
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center }
                  widgets:
                    # Hold the name for the test ring (see the top of this file).
                    - label:
                        text: "${timer_1_name}"
                        text_font: font_body
                        clickable: true
                        on_long_press:
                          - script.execute: timer_test_toggle
                    - label:
                        id: timer_1_time
                        text: "0:00"
                        text_font: font_timer
                        clickable: true
                        on_click:
                          - script.execute: { id: timer_clear_set, slot: 0 }
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between }
                  widgets:
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 0, minutes: 1 }], widgets: [label: { text: "+1", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 0, minutes: 5 }], widgets: [label: { text: "+5", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 0, minutes: 10 }], widgets: [label: { text: "+10", align: CENTER }] }
                    - button:
                        id: timer_1_go
                        width: 64
                        height: 44
                        on_click:
                          - script.execute: { id: timer_go, slot: 0 }
                        widgets:
                          - label: { id: timer_1_go_label, text: "Go", align: CENTER }
        - obj:
            width: 100%
            height: 130
            styles: card_style
            pad_all: 10
            scrollable: false
            layout: { type: flex, flex_flow: column, pad_row: 6 }
            widgets:
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center }
                  widgets:
                    - label: { text: "${timer_2_name}", text_font: font_body }
                    - label:
                        id: timer_2_time
                        text: "0:00"
                        text_font: font_timer
                        clickable: true
                        on_click:
                          - script.execute: { id: timer_clear_set, slot: 1 }
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between }
                  widgets:
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 1, minutes: 1 }], widgets: [label: { text: "+1", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 1, minutes: 5 }], widgets: [label: { text: "+5", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 1, minutes: 10 }], widgets: [label: { text: "+10", align: CENTER }] }
                    - button:
                        id: timer_2_go
                        width: 64
                        height: 44
                        on_click:
                          - script.execute: { id: timer_go, slot: 1 }
                        widgets:
                          - label: { id: timer_2_go_label, text: "Go", align: CENTER }
        - obj:
            width: 100%
            height: 130
            styles: card_style
            pad_all: 10
            scrollable: false
            layout: { type: flex, flex_flow: column, pad_row: 6 }
            widgets:
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center }
                  widgets:
                    - label: { text: "${timer_3_name}", text_font: font_body }
                    - label:
                        id: timer_3_time
                        text: "0:00"
                        text_font: font_timer
                        clickable: true
                        on_click:
                          - script.execute: { id: timer_clear_set, slot: 2 }
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout: { type: flex, flex_flow: row, flex_align_main: space_between }
                  widgets:
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 2, minutes: 1 }], widgets: [label: { text: "+1", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 2, minutes: 5 }], widgets: [label: { text: "+5", align: CENTER }] }
                    - button: { width: 64, height: 44, styles: add_style, on_click: [script.execute: { id: timer_add, slot: 2, minutes: 10 }], widgets: [label: { text: "+10", align: CENTER }] }
                    - button:
                        id: timer_3_go
                        width: 64
                        height: 44
                        on_click:
                          - script.execute: { id: timer_go, slot: 2 }
                        widgets:
                          - label: { id: timer_3_go_label, text: "Go", align: CENTER }

  top_layer:
    widgets:
      # The third page button.
      - button:
          id: nav_timers
          align: BOTTOM_LEFT
          x: 164
          y: -6
          width: 72
          height: 44
          styles: nav_style
          checked:
            styles: nav_checked_style
          on_click:
            - lvgl.page.show: timers_page
          widgets:
            - label: { text: "Timers", align: CENTER }

      # Running timers, in minutes, on every page but Timers.
      # It sits over the top right corner, where every page keeps only its
      # date or nothing, so it covers no button.
      - button:
          id: timer_chip
          hidden: true
          align: TOP_RIGHT
          x: -8
          y: 10
          width: 150
          height: 36
          bg_color: 0xFCE7B2
          text_color: 0x8E2A14
          radius: 12
          pad_left: 10
          pad_right: 10
          on_click:
            - lvgl.page.show: timers_page
          widgets:
            - label: { id: timer_chip_label, text: "", align: CENTER, width: 100%, text_align: CENTER, long_mode: dot, text_font: font_small }

      # Timer done. Full width, above everything, until Dismiss.
      - obj:
          id: timer_done_box
          hidden: true
          align: CENTER
          width: 100%
          height: SIZE_CONTENT
          bg_color: 0xFCE7B2
          text_color: 0x3A2606
          border_width: 4
          border_color: 0xC9594A
          radius: 16
          pad_all: 16
          shadow_width: 30
          shadow_opa: 50%
          layout:
            type: flex
            flex_flow: column
            flex_align_cross: center
            pad_row: 10
          widgets:
            - label:
                text: "Timer done"
                text_font: font_big
                text_color: 0xC9594A
            - label:
                id: timer_done_name
                width: 100%
                text: ""
                text_font: font_big
                text_align: CENTER
                long_mode: wrap
            - label:
                id: timer_done_when
                text: ""
                text_font: font_small
                text_color: 0x6A4612
            - button:
                width: 100%
                height: 56
                bg_color: 0xC9594A
                on_click:
                  - script.execute: timer_dismiss
                widgets:
                  - label: { text: "Dismiss", text_font: font_big, align: CENTER }
