# Family Dashboard room panel: the parts every panel shares.
#
# Wi-Fi, the encrypted Home Assistant API, OTA updates, the clock, the
# announcement banner, the backlight and the night schedule. A panel is this
# file, one board file and one profile file, see esphome/README.md.
#
# Substitutions the device file must set:
#   name, friendly_name     the ESPHome node name and its friendly name
#   api_key                 32-byte base64 key, from !secret (one per panel).
#                           It encrypts the API and OTA uploads both.
#
# What it deliberately leaves out: web_server, http_request, captive_portal and
# the fallback access point. The panel talks to Home Assistant and nothing else.

substitutions:
  # The announcement helper every panel shows. Point it at your own if your
  # announce script writes somewhere else (same "minutes|from|text" format).
  announcement_entity: input_text.family_announcement
  # "24h" (07:05) or "12h" (7:05, with am or pm after the date).
  clock_format: "24h"
  # The night window. Set both to the same time to switch night off.
  night_start: "21:00"
  night_end: "07:00"
  # What night looks like: "off" turns the screen off and pauses drawing;
  # "dim" keeps a low glow (night_glow_brightness) with the clock still going.
  # Either way a tap lights it at night_brightness for idle_timeout.
  night_mode: "off"
  night_glow_brightness: 4%
  # While this entity is "on" (a light, a switch, an input_boolean), night
  # waits: the panel stays as bright as by day. The default helper does not
  # exist until you make it, and a missing entity never keeps a panel awake.
  night_keep_awake_entity: input_boolean.family_panel_keep_awake
  # The brightness levels below are shares of the full backlight, sent to the
  # PWM as they are: 4% is 4% duty. ESPHome's light default, gamma_correct
  # 2.8, suits a bare LED but crushes the bottom of a screen backlight (4%
  # became 0.04^2.8, about 0.01% duty, and the glow went dark). Each board
  # file sets the backlight's gamma_correct to this; 2.8 brings that curve back.
  backlight_gamma: "1.0"
  day_brightness: 80%
  idle_brightness: 35%
  night_brightness: 10%
  idle_timeout: 90s
  # Wi-Fi power save: none, light or high. ESPHome's ESP32 default is light,
  # which lets the radio doze between beacons. On a kitchen panel that was
  # pings of 90 to 350 ms and a dozen short API drops in a day. These
  # panels run off mains, so the few milliamps saved buy nothing; none keeps
  # the radio awake. Set light only for a panel on a battery.
  wifi_power_save: none

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: dervish666.family-dashboard-panel
    version: "0.4.1"
  on_boot:
    priority: -100
    then:
      - script.execute: theme_apply
      - script.execute: check_night

logger:
  # INFO keeps letter and announcement text out of the log stream.
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # See wifi_power_save above. Left at ESPHome's defaults on purpose:
  # output_power (the chip's own maximum) and fast_connect (off, so the panel
  # scans and joins the strongest access point rather than the first one it
  # remembers, which matters on a mesh).
  power_save_mode: ${wifi_power_save}
  # No ap: block on purpose. A panel that cannot join Wi-Fi does not open a
  # hotspot; plug it into USB and flash it again. See esphome/README.md.

api:
  encryption:
    key: ${api_key}
  on_client_connected:
    # A letter marked read while Home Assistant was away: tell it now. The
    # delay lets Home Assistant finish subscribing before the event goes.
    - delay: 5s
    - script.execute: resend_pending

ota:
  # Encrypted with the API key; no separate OTA password to manage.
  - platform: esphome
    encryption: {}

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
      - script.execute: check_night
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
          - script.execute: check_night

globals:
  # Night as the panel acts on it: inside the window and not kept awake.
  - id: is_night
    type: bool
    initial_value: "false"
  - id: keep_awake
    type: bool
    initial_value: "false"
  # A theme package (packages/garden.yaml) sets this when its night look is
  # dark, so a profile's text turns light at night: see theme_apply.
  - id: theme_night_dark
    type: bool
    initial_value: "false"
  # What the panel last heard from Home Assistant, kept so a missing or broken
  # entity reads as "unavailable" instead of as a quiet day.
  - id: announcement_text
    type: std::string
    initial_value: '""'

script:
  # A profile with letters replaces this with its own (see profiles/kid.yaml).
  - id: resend_pending
    then:
      - logger.log: "Connected to Home Assistant"

  # Runs at boot and whenever night starts or ends. Profiles and theme
  # packages extend it to recolour what they draw; the base draws nothing
  # that changes.
  - id: theme_apply
    then:
      - lambda: (void) 0;

  - id: update_clock
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int hour = t.hour, minute = t.minute;
          bool twelve = std::string("${clock_format}") == "12h";
          std::string clock, suffix;
          // BEGIN clock-format (tests/panels/check.py compiles this block)
          {
            char buf[8];
            if (twelve) {
              int h = hour % 12;
              if (h == 0) h = 12;
              snprintf(buf, sizeof buf, "%d:%02d", h, minute);
              suffix = hour < 12 ? "am" : "pm";
            } else {
              snprintf(buf, sizeof buf, "%02d:%02d", hour, minute);
            }
            clock = buf;
          }
          // END clock-format
          std::string date = t.strftime("%a %d %b");
          if (!suffix.empty()) date += ", " + suffix;
          lv_label_set_text(id(clock_label), clock.c_str());
          lv_label_set_text(id(date_label), date.c_str());

  # Works out night or day from night_start, night_end and the keep-awake
  # entity, and switches the screen when the answer changes: on the minute
  # either time passes, or the moment the keep-awake entity changes.
  - id: check_night
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int sh = 0, sm = 0, eh = 0, em = 0;
          sscanf("${night_start}", "%d:%d", &sh, &sm);
          sscanf("${night_end}", "%d:%d", &eh, &em);
          int now_m = t.hour * 60 + t.minute, start_m = sh * 60 + sm, end_m = eh * 60 + em;
          bool keep = id(keep_awake), night;
          // BEGIN night-window (tests/panels/check.py compiles this block)
          {
            bool window = start_m == end_m ? false
                        : start_m < end_m ? (now_m >= start_m && now_m < end_m)
                                          : (now_m >= start_m || now_m < end_m);
            night = window && !keep;
          }
          // END night-window
          if (night == id(is_night)) return;
          id(is_night) = night;
          id(theme_apply).execute();
          if (night) id(screen_off).execute(); else id(wake_screen).execute();

  # Night rest: a low glow with the clock running (night_mode dim), or the
  # backlight off and drawing paused (night_mode off, the default).
  - id: screen_off
    then:
      - if:
          condition:
            lambda: return std::string("${night_mode}") == "dim";
          then:
            - if:
                condition: lvgl.is_paused
                then:
                  - lvgl.resume:
                  - lvgl.widget.redraw:
            - light.turn_on: { id: backlight, brightness: "${night_glow_brightness}" }
          else:
            - light.turn_off: backlight
            - lvgl.pause:

  # Boards call this on every touch release. At night it lights the screen
  # dimly; by day it brings a dimmed screen back to full.
  - id: wake_screen
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            lambda: return id(is_night);
          then:
            - light.turn_on: { id: backlight, brightness: "${night_brightness}" }
          else:
            - light.turn_on: { id: backlight, brightness: "${day_brightness}" }

text_sensor:
  # Keeps night waiting while it reads "on". Anything else, a missing entity
  # included, lets night happen on schedule.
  - platform: homeassistant
    id: keep_awake_state
    entity_id: ${night_keep_awake_entity}
    internal: true
    on_value:
      - lambda: id(keep_awake) = x == "on";
      - script.execute: check_night

  # The card's announcement helper. Same contract as the card: plain text,
  # "Name: text", or "minutes|from|text" as script.family_announce writes it.
  # Read-only here; no panel can change it except through Home Assistant.
  - platform: homeassistant
    id: announcement_raw
    entity_id: ${announcement_entity}
    internal: true
    on_value:
      - lambda: |-
          std::string shown;
          // BEGIN announcement-parse (tests/panels/check.py compiles this block)
          {
            std::string s = x;
            auto trim = [](std::string v) {
              size_t a = v.find_first_not_of(" \t\r\n");
              if (a == std::string::npos) return std::string();
              size_t b = v.find_last_not_of(" \t\r\n");
              return v.substr(a, b - a + 1);
            };
            s = trim(s);
            // "unknown" is a helper that was never set: no announcement.
            if (s == "unknown") s = "";
            if (s == "unavailable") {
              shown = "Announcements unavailable";
            } else if (!s.empty()) {
              size_t p1 = s.find('|');
              size_t p2 = p1 == std::string::npos ? std::string::npos : s.find('|', p1 + 1);
              bool minutes = p1 != std::string::npos && p1 > 0 && p2 != std::string::npos &&
                             s.find_first_not_of("0123456789") == p1;
              if (minutes) {
                std::string from = trim(s.substr(p1 + 1, p2 - p1 - 1));
                std::string text = trim(s.substr(p2 + 1));
                if (!text.empty()) shown = from.empty() ? text : from + ": " + text;
              } else {
                shown = s;
              }
            }
          }
          // END announcement-parse
          id(announcement_text) = shown;
          if (shown.empty()) {
            lv_obj_add_flag(id(announce_box), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(announce_label), shown.c_str());
            lv_obj_clear_flag(id(announce_box), LV_OBJ_FLAG_HIDDEN);
          }

interval:
  # A small "offline" tag while Home Assistant is not connected, so stale
  # text on the screen never passes for fresh.
  - interval: 10s
    then:
      - if:
          condition: api.connected
          then:
            - lvgl.widget.hide: offline_label
          else:
            - lvgl.widget.show: offline_label

font:
  # One Google font in four sizes, with the Latin set so letters can carry
  # a pound sign, accents and curly quotes. Fetched at compile time only.
  # bpp 4 is what makes the glyphs smooth: ESPHome's default is 1 bit per
  # pixel, hard black-or-white edges that read as jagged on a 3.5" screen.
  - file: "gfonts://Nunito@700"
    id: font_small
    size: ${font_small}
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "£€°’‘“”…–éèêëáàâäíìîïóòôöúùûüçñÉÁÓÚß"
  - file: "gfonts://Nunito@700"
    id: font_body
    size: ${font_body}
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "£€°’‘“”…–éèêëáàâäíìîïóòôöúùûüçñÉÁÓÚß"
  - file: "gfonts://Nunito@800"
    id: font_big
    size: ${font_big}
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "£€°’‘“”…–éèêëáàâäíìîïóòôöúùûüçñÉÁÓÚß"
  - file: "gfonts://Nunito@800"
    id: font_clock
    size: ${font_clock}
    bpp: 4
    glyphs: "0123456789:"

lvgl:
  id: panel_lvgl
  default_font: font_body
  on_idle:
    # A list, so a profile can add its own idle step (the kitchen goes home).
    - timeout: ${idle_timeout}
      then:
        - if:
            condition:
              lambda: return id(is_night);
            then:
              - script.execute: screen_off
            else:
              - light.turn_on: { id: backlight, brightness: "${idle_brightness}" }
  # The palette: cream ground, white cards with a sand border, warm amber for
  # anything lit or needing attention, green to go, red to stop. Text colour
  # is set on obj and inherited, never pinned on label: a label with its own
  # text_color ignores its button's, which is how an "All off" button once
  # drew dark text on a dark fill and read as a black bar.
  theme:
    obj:
      bg_color: 0xFFF8EC
      text_color: 0x2E2A24
      border_width: 0
      radius: 0
      pad_all: 0
    button:
      bg_color: 0x3F7A50
      text_color: 0xFFFFFF
      radius: 12
      border_width: 0
      shadow_width: 0
      pad_all: 0
  style_definitions:
    - id: card_style
      bg_color: 0xFFFFFF
      text_color: 0x2E2A24
      radius: 16
      pad_all: 12
      border_width: 2
      border_color: 0xE8DCC4
    - id: banner_style
      bg_color: 0xFCE7B2
      text_color: 0x3A2606
      radius: 12
      pad_all: 10
      border_width: 0
    # A card's small heading: muted, spaced out, read from across a room.
    - id: section_style
      text_font: font_small
      text_color: 0x7A7366
      text_letter_space: 1
