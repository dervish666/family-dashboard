# Fake Home Assistant for a kid render: the garden by day with no letter and
# with one waiting, the letter open, an announcement, the light page for each
# lamp (the globe takes brightness only; the big light off, then warm white,
# then in colour under its two tabs),
# then the garden at night. See fake_kitchen.yaml.

esphome:
  on_boot:
    priority: -200
    then:
      - script.execute: render_all

script:
  - id: render_all
    then:
      - lambda: |-
          id(ha_time).set_epoch_time(1793197800);
          id(update_clock).execute();
          id(letter_raw).publish_state("");
          id(announcement_raw).publish_state("");
          id(lamp_1_src).publish_state("on");
          id(lamp_2_src).publish_state("off");
          id(lights_text).publish_state("kid_a_globe on 40 - - - b - -\nkid_a_main off - - 2000 6535 btc - -");
      - delay: 1200ms
      - snapshot.take: { filename: "kid-home.bmp" }
      - lambda: |-
          id(letter_raw).publish_state("Parent 1|Well done in your spelling test! Tea is at six, and Grandma is coming on Saturday. Love you lots.");
      - delay: 300ms
      - snapshot.take: { filename: "kid-letter.bmp" }
      - lambda: id(announcement_raw).publish_state("20|Kitchen|Dinner's ready");
      - delay: 300ms
      - snapshot.take: { filename: "kid-announcement.bmp" }
      - script.execute: open_letter
      - delay: 300ms
      - snapshot.take: { filename: "kid-letter-open.bmp" }
      - script.execute: go_home
      - lambda: |-
          id(letter_raw).publish_state("");
          id(announcement_raw).publish_state("");
      - script.execute: { id: light_hold_open, target: kid_a_globe, name: "Globe" }
      - delay: 300ms
      - snapshot.take: { filename: "kid-light-brightness.bmp" }
      # The big light off: every value unknown, so every slider dims.
      - script.execute: { id: light_hold_open, target: kid_a_main, name: "Big light" }
      - delay: 300ms
      - snapshot.take: { filename: "kid-light-off.bmp" }
      # On, as a warm-white lamp: two blocks, centred.
      - lambda: |-
          id(lamp_2_src).publish_state("on");
          id(lights_text).publish_state("kid_a_globe on 40 - - - b - -\nkid_a_main on 60 3200 2000 6535 bt - -");
      - delay: 300ms
      - snapshot.take: { filename: "kid-light-warmth.bmp" }
      # On, in colour mode: four controls under two tabs; kelvin unknown dims Warmth.
      - lambda: |-
          id(lights_text).publish_state("kid_a_globe on 40 - - - b - -\nkid_a_main on 85 - 2000 6535 btc 300 70");
      - delay: 300ms
      - snapshot.take: { filename: "kid-light-colour.bmp" }
      - script.execute: { id: light_hold_tab, tab: 1 }
      - delay: 300ms
      - snapshot.take: { filename: "kid-light-colour-tab.bmp" }
      - script.execute: go_home
      - lambda: |-
          // Night: the garden asleep, the clock in pale ink, the fireflies out.
          id(is_night) = true;
          id(theme_apply).execute();
      - delay: 1500ms
      - snapshot.take: { filename: "kid-night.bmp" }
      - lambda: |-
          id(is_night) = false;
          id(theme_apply).execute();
      - delay: 200ms
      - lambda: exit(0);
