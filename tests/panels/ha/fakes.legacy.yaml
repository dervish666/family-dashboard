# The same fake lamps and forecast as fakes.modern.yaml, in the platform
# syntax older Home Assistant reads (2024.12 has no `template: - light:`).
# ha_live.py copies this one to /config/fakes.yaml for an image older than
# 2026.1. Keep the two files describing the same lamps.
light:
  - platform: template
    lights:
      # A warm-white lamp: brightness and colour temperature, 2000 to 6666 K.
      kitchen:
        friendly_name: Kitchen
        unique_id: test_light_kitchen
        value_template: "{{ is_state('input_boolean.lamp_kitchen', 'on') }}"
        level_template: "{{ states('input_number.kitchen_level') | int }}"
        temperature_template: "{{ states('input_number.kitchen_mireds') | int }}"
        min_mireds_template: "150"
        max_mireds_template: "500"
        turn_on: { action: input_boolean.turn_on, target: { entity_id: input_boolean.lamp_kitchen } }
        turn_off: { action: input_boolean.turn_off, target: { entity_id: input_boolean.lamp_kitchen } }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.kitchen_level }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.lamp_kitchen }
        set_temperature:
          - action: input_number.set_value
            target: { entity_id: input_number.kitchen_mireds }
            data: { value: "{{ color_temp }}" }
          - if: "{{ brightness is defined }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.kitchen_level }
                data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.lamp_kitchen }
      # A colour lamp: brightness, colour temperature and hue/saturation.
      living_room:
        friendly_name: Living room
        unique_id: test_light_living_room
        value_template: "{{ is_state('input_boolean.lamp_living_room', 'on') }}"
        level_template: "{{ states('input_number.living_room_level') | int }}"
        temperature_template: "{{ states('input_number.living_room_mireds') | int }}"
        min_mireds_template: "150"
        max_mireds_template: "500"
        hs_template: "{{ (states('input_number.living_room_hue') | float, states('input_number.living_room_sat') | float) }}"
        turn_on: { action: input_boolean.turn_on, target: { entity_id: input_boolean.lamp_living_room } }
        turn_off: { action: input_boolean.turn_off, target: { entity_id: input_boolean.lamp_living_room } }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.living_room_level }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.lamp_living_room }
        set_temperature:
          - action: input_number.set_value
            target: { entity_id: input_number.living_room_mireds }
            data: { value: "{{ color_temp }}" }
          - if: "{{ brightness is defined }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.living_room_level }
                data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.lamp_living_room }
        set_hs:
          - action: input_number.set_value
            target: { entity_id: input_number.living_room_hue }
            data: { value: "{{ h }}" }
          - action: input_number.set_value
            target: { entity_id: input_number.living_room_sat }
            data: { value: "{{ s }}" }
          - if: "{{ brightness is defined }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.living_room_level }
                data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.lamp_living_room }
      hall:
        friendly_name: Hall
        unique_id: test_light_hall
        value_template: "{{ is_state('input_boolean.lamp_hall', 'on') }}"
        turn_on: { action: input_boolean.turn_on, target: { entity_id: input_boolean.lamp_hall } }
        turn_off: { action: input_boolean.turn_off, target: { entity_id: input_boolean.lamp_hall } }

weather:
  - platform: template
    name: Forecast home
    unique_id: test_forecast_home
    condition_template: "cloudy"
    # Numbers, not text: the old weather entity rounds the humidity as it is
    # given, and a static "80" stays the string "80" (a TypeError at start-up).
    temperature_template: "{{ 12 }}"
    humidity_template: "{{ 80 }}"
    forecast_hourly_template: >-
      {% set wet = states('input_text.test_wet_hour') | int(-1) %}
      {% set base = now().replace(minute=0, second=0, microsecond=0) %}
      {% set ns = namespace(f=[]) %}
      {% for i in range(0, 14) %}
        {% set ns.f = ns.f + [{'datetime': (base + timedelta(hours=i)).isoformat(),
                               'condition': 'rainy' if i == wet else 'cloudy',
                               'precipitation_probability': 80 if i == wet else 10,
                               'temperature': 12}] %}
      {% endfor %}
      {{ ns.f }}
