# Throwaway Home Assistant config for tests/panels/ha_live.py. It loads the
# shipped panels.example.yaml, panels-kitchen.example.yaml and
# scripts.example.yaml unchanged, plus fake versions of the card's sensors,
# lights, a bin day, a printer, a rain sensor and a forecast, so the panel
# sensors and automations have something to read and switch. The test drives
# the fakes through the input_text and input_boolean helpers below.
homeassistant:
  name: Panels test
  time_zone: Europe/London
  country: GB
  unit_system: metric
  packages:
    panels: !include panels.example.yaml
    panels_kitchen: !include panels-kitchen.example.yaml
    # The lamps and the forecast; ha_live.py picks the file for the version.
    fakes: !include fakes.yaml

http:
api:
system_log:
logger:
  default: warning
  logs:
    family_panels: info

script: !include scripts.example.yaml

input_text:
  family_letter:
    name: Family letter
    max: 255
  family_announcement:
    name: Family announcement
    max: 255
    initial: ""
  # Days to the next bin collection; "gone" makes the bin sensor unavailable.
  test_bins:
    name: Test bins
    initial: "1"
  # The rain sensor's state.
  test_rain:
    name: Test rain
    initial: "none"
  # Hours from now of the one wet hour in the forecast; -1 for none.
  test_wet_hour:
    name: Test wet hour
    initial: "-1"

input_select:
  kid_b_lunch:
    name: Kid B lunch
    options: [School dinner, Packed lunch]
    initial: Packed lunch

input_number:
  # What the light page set on the adjustable lamps: the kitchen (brightness
  # and warmth) and the living room (brightness, warmth and colour).
  kitchen_level:
    name: Kitchen level
    min: 0
    max: 255
    initial: 128
  kitchen_mireds:
    name: Kitchen mireds
    min: 150
    max: 500
    initial: 370
  living_room_level:
    name: Living room level
    min: 0
    max: 255
    initial: 255
  living_room_mireds:
    name: Living room mireds
    min: 150
    max: 500
    initial: 250
  living_room_hue:
    name: Living room hue
    min: 0
    max: 360
    initial: 30
  living_room_sat:
    name: Living room sat
    min: 0
    max: 100
    initial: 100

input_boolean:
  lamp_kitchen:
    name: Lamp kitchen
    initial: false
  lamp_living_room:
    name: Lamp living room
    initial: false
  lamp_hall:
    name: Lamp hall
    initial: false

template:
  - sensor:
      - name: Family Today
        unique_id: test_family_today
        state: "3"
        attributes:
          checked_at: "{{ now().isoformat() }}"
          # Enough all-day clubs to overflow a 255-character state, so the
          # test sees the state cut with "+N more" and the attribute whole.
          events: >-
            {% set ns = namespace(e=[
              {'who': 'House', 'what': 'Bin day', 'all_day': true, 'start': now().date().isoformat(), 'at': ''},
              {'who': 'Kid A', 'what': 'Swimming', 'all_day': false,
               'start': (now() + timedelta(hours=2)).isoformat(), 'at': (now() + timedelta(hours=2)).strftime('%H:%M')},
              {'who': 'Parent 1', 'what': 'Long gone', 'all_day': false,
               'start': (now() - timedelta(hours=3)).isoformat(), 'at': (now() - timedelta(hours=3)).strftime('%H:%M')}
            ]) %}
            {% for i in range(1, 13) %}
              {% set ns.e = ns.e + [{'who': 'Kid B', 'what': 'After-school club number ' ~ i, 'all_day': true,
                                     'start': now().date().isoformat(), 'at': ''}] %}
            {% endfor %}
            {{ ns.e }}
      - name: Due Times
        unique_id: test_due_times
        state: "3"
        attributes:
          items: >-
            {{ [
              {'label': 'Library books back', 'due': (now() + timedelta(hours=1)).strftime('%H:%M'), 'person': 'Kid A'},
              {'label': 'Trip form', 'due': now().date().isoformat()},
              {'label': 'Far away', 'due': (now() + timedelta(days=5)).date().isoformat()},
              {'label': 'Broken', 'due': 'tomorrowish'}
            ] }}
      - name: Family Kit
        unique_id: test_family_kit
        state: "1"
        attributes:
          kit_today: PE kit
      - name: Kid A Lunch
        unique_id: test_kid_a_lunch
        state: "ok"
        attributes:
          menu: >-
            {{ {now().date().isoformat(): {'status': 'served',
                'options': [{'name': 'Pasta bake', 'kind': 'main'}, 'Jacket potato'],
                'choice': 'Bean chilli'}} }}
      - name: Kid B Lunch
        unique_id: test_kid_b_lunch
        state: "ok"
        attributes:
          menu: "{{ {} }}"
      # Two-week timetable anchored on last Monday (week A), so this week is
      # B. Week A today would say History; week B says Maths and Art.
      - name: Kid A Timetable
        unique_id: test_kid_a_timetable
        state: "ok"
        attributes:
          timetable: >-
            {% set d = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] %}
            {% set last_mon = (now().date() - timedelta(days=now().weekday() + 7)).isoformat() %}
            {{ {'weeks': ['A', 'B'], 'anchor': last_mon,
                'days': {'A': {d: ['History|H1']}, 'B': {d: ['Maths|M1', {'subject': 'Art', 'room': 'A2'}]}},
                'closed': []} }}
      - name: Bin Collections
        unique_id: test_bin_collections
        state: "{{ states('input_text.test_bins') }}"
        availability: "{{ states('input_text.test_bins') != 'gone' }}"
        attributes:
          next_days: "{{ states('input_text.test_bins') | int(0) }}"
          next_short: "{{ ['Black bin', 'Food'] }}"
          fetch: ok
      - name: a1mini SERIAL print status
        unique_id: test_printer_status
        state: running
      - name: a1mini SERIAL print progress
        unique_id: test_printer_progress
        state: "45"
      - name: a1mini SERIAL end time
        unique_id: test_printer_end
        state: "{{ (now().replace(second=0, microsecond=0) + timedelta(hours=2)).isoformat() }}"
      - name: Rain Sensor
        unique_id: test_rain_sensor
        state: "{{ states('input_text.test_rain') }}"
