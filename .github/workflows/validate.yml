name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # main as of 2026-11-20 (its last commit is from 2026-06-08), pinned so a push there cannot change this job
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin

  # dist/family-dashboard.js is what HACS serves, and it is built from src/. Rebuild it and
  # fail if the committed file is not exactly that build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Committed dist matches a fresh build
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/; git diff --stat -- dist/
            echo "dist/ is not the build of src/: run npm run build and commit dist/"; exit 1
          fi

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Config, calendar, creature and scene checks
        run: node tests/check.mjs
      # Again on New York time (the runner's own zone is UTC), so a check that only holds on
      # UK time fails here. The engine cases set their own zone and run the same both times.
      - name: The same checks in New York
        run: node tests/check.mjs
        env:
          TZ: America/New_York
      - name: Prove the checks can fail
        run: sh tests/falsify.sh

  # The committed card on /demo/ in Chromium at 1280x800, 1024x768, 800x1280 and 400x800: the HUD's
  # boxes do not overlap, Tab and Enter open a card and Escape closes it, and the page logs no
  # errors. check.mjs never lays out the HUD, so this is what catches a collision. The
  # screenshots are kept.
  demo-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Playwright and Chromium in a venv
        run: |
          python -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium
      - name: The demo at four sizes, at night and on a resize
        env:
          DEMO_SMOKE_SHOTS: ${{ runner.temp }}/demo-smoke
        run: |
          "$RUNNER_TEMP/pw/bin/python" tests/demo/smoke.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke
          path: ${{ runner.temp }}/demo-smoke
          if-no-files-found: warn
