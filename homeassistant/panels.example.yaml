# Room panels: Home Assistant's half (optional, see esphome/README.md).
#
# Letters to one child's room panel, the kitchen panel's preset
# announcements, and three text sensors the kitchen panel shows (today, lunch
# and kit, due). Every panel already reads input_text.family_announcement
# (configuration.example.yaml) as a read-only banner. The kitchen panel's
# lights, timers, strip and rain are in panels-kitchen.example.yaml.
#
# Install as a package so nothing has to be merged by hand:
#   1. configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to /config/packages/family_panels.yaml.
#   3. Change the names below (search for "Kid A"), restart Home Assistant.
#
# Placeholders to replace:
#   kid_a, kid_b, kid_c      one slug per child with a panel. The slug is in the
#                            helper names and in the panel's `child:` substitution.
#   Kid A, Kid B, Kid C      the child's name as the card's people option spells
#                            it (used when a letter is copied to the postie)
#   sensor.kid_a_lunch ...   the card's lunch and timetable sensors, in `kids`
#                            under sensor.panel_lunch_and_kit
#   sensor.due_times         due_src, the card's due row sensor, under sensor.panel_due
#   broadcast_presets        must match preset_1..preset_4 on the kitchen panel
#   announce_script          the script a preset runs (script.family_announce)
#
# ── The letter contract ────────────────────────────────────────────────────
# One input_text per child, input_text.letter_<slug>, holding "from|text":
#   "Parent 1|Tea's at six, love you"   a letter from Parent 1
#   "|Tea's at six"  or  "Tea's at six" a letter with no sender
#   ""                                  no letter
# Split on the FIRST "|" only, so the text may contain "|". Trim both halves.
# A sender and no text ("Parent 1|") is no letter. One letter per child at a
# time: a new one replaces an unread one.
#
# input_text caps the whole value at 255 characters, sender and "|"
# included. The script trims the sender to 24 and cuts the total to 255, so
# a letter has room for about 230 characters of text. A text entity from
# another integration works too if it keeps the same format; 255 is still
# the ceiling, because that is what an entity state can hold.
#
# input_datetime.letter_<slug>_sent (optional) records when it was sent. A
# panel's Done carries the time it saw, so a Done on an old letter never
# clears a newer one that arrived meanwhile, and the daily expiry uses it.
# Without it the expiry falls back to the helper's last change.
#
# Read once, gone everywhere: whoever reads it first (the panel's Done, or
# opening that child on the wall card, which reads the helper itself when the
# card's people option gives them `letter: input_text.letter_<slug>`) empties
# the helper,
# and every screen drops it. Until then it waits in the helper: a panel that
# was off or offline shows it when it comes back.
#
# ── Who can post ───────────────────────────────────────────────────────────
# Home Assistant has no per-entity permissions. Every Home Assistant user,
# and anything holding a token, can run the script or type straight into the
# helpers. So: give Home Assistant accounts only to people you would let
# write to a child's room, send letters through script.family_send_panel_letter
# (it checks the recipient and the format), and keep the helpers off
# dashboards the kids use. The panels themselves cannot send letters.

input_text:
  # No `initial:` on purpose. Home Assistant restores the last value after a
  # restart, which is what keeps an unread letter waiting.
  letter_kid_a:
    name: Letter for Kid A
    icon: mdi:email-outline
    max: 255
  letter_kid_b:
    name: Letter for Kid B
    icon: mdi:email-outline
    max: 255
  letter_kid_c:
    name: Letter for Kid C
    icon: mdi:email-outline
    max: 255

input_datetime:
  letter_kid_a_sent:
    name: Letter for Kid A sent
    has_date: true
    has_time: true
  letter_kid_b_sent:
    name: Letter for Kid B sent
    has_date: true
    has_time: true
  letter_kid_c_sent:
    name: Letter for Kid C sent
    has_date: true
    has_time: true

script:
  family_send_panel_letter:
    alias: "Family: send a letter to a room panel"
    description: >-
      Writes "sender|text" to input_text.letter_<slug> and the time to
      input_datetime.letter_<slug>_sent. `to` is a slug (kid_a) or a name
      (Kid A). Stops with an error for a recipient it does not know, a missing
      helper or an empty text. Optionally copies the letter to the card's
      postie (input_text.family_letter) too, the bridge for a wall card
      before v1.8 or a child with no `letter:` on the card. The card shows a
      letter once either way; set postie to '' below to turn the bridge off.
    icon: mdi:email-fast
    mode: queued
    max: 10
    # The selectors say multiline: false rather than `text: {}`: Home
    # Assistant's package merge drops empty mappings, and the script then
    # fails validation with "Only one type can be specified".
    fields:
      to:
        name: To
        description: The child, as a slug (kid_a) or a name (Kid A)
        required: true
        example: kid_a
        selector:
          text:
            multiline: false
      sender:
        name: From
        description: Who it is from, up to 24 characters (optional)
        example: Parent 1
        selector:
          text:
            multiline: false
      text:
        name: Letter
        description: Plain text, one line. About 230 characters fit.
        required: true
        example: Tea's at six, love you
        selector:
          text:
            multiline: false
    variables:
      # The children with a panel: slug to the name the card's people option
      # uses. The only list of recipients; the automations below reuse it.
      recipients: &panel_recipients
        kid_a: Kid A
        kid_b: Kid B
        kid_c: Kid C
      postie: input_text.family_letter
      slug: "{{ to | default('') | string | trim | slugify }}"
      from_part: "{{ (sender | default('') | string | replace('|', '/') | replace('\n', ' ') | trim)[:24] | trim }}"
      body: "{{ text | default('') | string | replace('\n', ' ') | trim }}"
      helper: "input_text.letter_{{ slug }}"
      sent_helper: "input_datetime.letter_{{ slug }}_sent"
      value: "{{ (from_part ~ '|' ~ body)[:255] }}"
      postie_value: >-
        {{ ((recipients[slug] if slug in recipients else '') ~ ': '
            ~ ('From ' ~ from_part ~ ': ' if from_part else '') ~ body)[:255] }}
    sequence:
      - if: "{{ slug not in recipients }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: family_panels
              message: >-
                family_send_panel_letter: no child "{{ to }}". Known:
                {{ recipients.keys() | join(', ') }}.
          - stop: Unknown recipient
            error: true
      # An existence check, not a state check: a helper that has never held
      # a letter reads "unknown", and that is a valid empty mailbox.
      - if: "{{ helper not in states.input_text | map(attribute='entity_id') | list }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: family_panels
              message: "family_send_panel_letter: {{ helper }} does not exist. Add it under input_text."
          - stop: Letter helper missing
            error: true
      - if: "{{ body == '' }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: family_panels
              message: "family_send_panel_letter: the letter to {{ slug }} was empty; nothing sent."
          - stop: Empty letter
            error: true
      - action: input_text.set_value
        target:
          entity_id: "{{ helper }}"
        data:
          value: "{{ value }}"
      - if: "{{ sent_helper in states.input_datetime | map(attribute='entity_id') | list }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ sent_helper }}"
            data:
              timestamp: "{{ now().timestamp() | int }}"
      - if: "{{ postie != '' and postie in states.input_text | map(attribute='entity_id') | list }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: "{{ postie }}"
            data:
              value: "{{ postie_value }}"

automation:
  # A panel's Done. The panel fires esphome.family_letter_read with its child
  # and the sent time it saw; Home Assistant accepts esphome.* events from any
  # adopted ESPHome device without the "allow actions" option.
  - id: family_panel_letter_read
    alias: "Family: a room panel read its letter"
    mode: queued
    triggers:
      - trigger: event
        event_type: esphome.family_letter_read
    variables:
      recipients: *panel_recipients
      postie: input_text.family_letter
      slug: "{{ trigger.event.data.child | default('') | string | slugify }}"
      seen_sent: "{{ trigger.event.data.sent | default('') | string }}"
      helper: "input_text.letter_{{ slug }}"
      sent_helper: "input_datetime.letter_{{ slug }}_sent"
    actions:
      - if: "{{ slug not in recipients }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: family_panels
              message: "A room panel reported a letter read for an unknown child: {{ slug }}"
          - stop: Unknown child
      - if: >-
          {{ seen_sent not in ['', 'unknown', 'unavailable']
             and states(sent_helper) not in ['unknown', 'unavailable']
             and states(sent_helper) != seen_sent }}
        then:
          - action: system_log.write
            data:
              level: info
              logger: family_panels
              message: "{{ helper }}: a newer letter arrived after the one marked read; kept it."
          - stop: Newer letter kept
      - variables:
          current: "{{ states(helper) if states(helper) not in ['unknown', 'unavailable'] else '' }}"
          parts: "{{ current.split('|', 1) }}"
          from_part: "{{ parts[0] | trim if parts | count > 1 else '' }}"
          body: "{{ (parts[1] if parts | count > 1 else parts[0]) | trim }}"
          mirror: >-
            {{ (recipients[slug] ~ ': ' ~ ('From ' ~ from_part ~ ': ' if from_part else '') ~ body)[:255] }}
      - action: input_text.set_value
        target:
          entity_id: "{{ helper }}"
        data:
          value: ""
      - if: "{{ postie != '' and body != '' and states(postie) == mirror }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: "{{ postie }}"
            data:
              value: ""

  # The bridge, optional since card v1.8. A card before v1.8, or a child with
  # no `letter:` on the card, only sees the postie copy and empties
  # input_text.family_letter when that person's card is opened. If what it
  # emptied was a copy of a panel letter, that letter was read on the wall, so
  # clear the panel too. Card v1.8 with `letter:` on every child empties the
  # child's helper itself (and the copy): set postie to '' in the script and
  # delete this automation if you like, nothing depends on them.
  - id: family_panel_letter_read_on_card
    alias: "Family: a panel letter was read on the wall card"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_text.family_letter
        to: ""
    variables:
      recipients: *panel_recipients
      emptied: "{{ trigger.from_state.state if trigger.from_state else '' }}"
    conditions:
      - "{{ emptied not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - repeat:
          for_each: "{{ recipients.keys() | list }}"
          sequence:
            - variables:
                helper: "input_text.letter_{{ repeat.item }}"
                current: "{{ states(helper) if states(helper) not in ['unknown', 'unavailable'] else '' }}"
                parts: "{{ current.split('|', 1) }}"
                from_part: "{{ parts[0] | trim if parts | count > 1 else '' }}"
                body: "{{ (parts[1] if parts | count > 1 else parts[0]) | trim }}"
                mirror: >-
                  {{ (recipients[repeat.item] ~ ': ' ~ ('From ' ~ from_part ~ ': ' if from_part else '') ~ body)[:255] }}
            - if: "{{ body != '' and mirror == emptied }}"
              then:
                - action: input_text.set_value
                  target:
                    entity_id: "{{ helper }}"
                  data:
                    value: ""

  # Daily expiry: an unread letter older than expire_days goes at 03:30, so a
  # panel that was unplugged for a week does not open on stale news. Set
  # expire_days to 0 to keep letters until they are read.
  - id: family_panel_letter_expire
    alias: "Family: expire old room panel letters"
    mode: single
    triggers:
      - trigger: time
        at: "03:30:00"
    variables:
      recipients: *panel_recipients
      expire_days: 3
    conditions:
      - "{{ expire_days | int(0) > 0 }}"
    actions:
      - repeat:
          for_each: "{{ recipients.keys() | list }}"
          sequence:
            - variables:
                helper: "input_text.letter_{{ repeat.item }}"
                sent_helper: "input_datetime.letter_{{ repeat.item }}_sent"
                sent_ts: >-
                  {% set s = as_timestamp(states(sent_helper), none) %}
                  {% if s is none and states[helper] is defined %}{% set s = as_timestamp(states[helper].last_changed) %}{% endif %}
                  {{ s if s is not none else 0 }}
            - if: >-
                {{ states(helper) not in ['', 'unknown', 'unavailable']
                   and sent_ts | float(0) > 0
                   and as_timestamp(now()) - sent_ts | float(0) > expire_days | int * 86400 }}
              then:
                - action: input_text.set_value
                  target:
                    entity_id: "{{ helper }}"
                  data:
                    value: ""
                - action: system_log.write
                  data:
                    level: info
                    logger: family_panels
                    message: "{{ helper }}: unread for over {{ expire_days }} days, expired."

  # The kitchen panel's preset buttons. The panel sends the button's text;
  # only a message on this list is announced, so a panel can never post
  # anything else. announce_script is the script that puts it up:
  # script.family_announce from scripts.example.yaml by default, or your own,
  # if it takes the same three fields (message, sender, minutes).
  - id: family_panel_broadcast
    alias: "Family: a panel sent a preset announcement"
    mode: queued
    triggers:
      - trigger: event
        event_type: esphome.family_panel_broadcast
    variables:
      broadcast_presets:
        - "Dinner's ready"
        - "Shoes on, we're leaving"
        - "Come downstairs please"
        - "Bedtime in ten minutes"
      broadcast_sender: Kitchen
      broadcast_minutes: 20
      announce_script: script.family_announce
      message: "{{ trigger.event.data.message | default('') | string | trim }}"
    actions:
      - if: "{{ message not in broadcast_presets }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: family_panels
              message: >-
                A panel sent "{{ message[:60] }}", which is not in broadcast_presets.
                Nothing was announced. Make the panel's preset_1..4 match the list.
          - stop: Not a preset
      - if: "{{ states(announce_script) in ['unknown', 'unavailable'] }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: family_panels
              message: "Panel preset not announced: {{ announce_script }} is missing (see scripts.example.yaml)."
          - stop: No announce script
      - action: script.turn_on
        target:
          entity_id: "{{ announce_script }}"
        data:
          variables:
            message: "{{ message }}"
            sender: "{{ broadcast_sender }}"
            minutes: "{{ broadcast_minutes }}"

template:
  # What the kitchen panel shows. Each sensor has two forms of the same
  # lines: the state, cut to fit the 255 characters a state can hold (what a
  # v1 kitchen panel and the generic profile read), and the `lines`
  # attribute, newline separated and not cut, which the v2 kitchen pages
  # read. Attributes have no 255 limit. A missing source says so by name
  # instead of reading as a quiet day.
  #
  # Trigger-based, so the lines are worked out once per update and both forms
  # agree: every minute (times pass), at start-up, and whenever the source
  # sensor changes.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: sensor.family_today
    action:
      - variables:
          # From sensor.family_today (configuration.example.yaml): all-day
          # events first, then timed ones, hiding any that started over an
          # hour ago.
          today_lines: >-
            {% set src = 'sensor.family_today' %}
            {% set evs = state_attr(src, 'events') %}
            {% if evs is string %}{% set evs = evs | from_json %}{% endif %}
            {% if states(src) in ['unknown', 'unavailable'] or evs is none %}
              {{ ['Calendar unavailable (' ~ src ~ ')'] }}
            {% else %}
              {% set nowts = as_timestamp(now()) %}
              {% set ns = namespace(lines=[]) %}
              {% set checked = as_timestamp(state_attr(src, 'checked_at'), 0) %}
              {% if nowts - checked > 1200 %}
                {% set ns.lines = ['Not checked since ' ~ (checked | timestamp_custom('%H:%M') if checked else 'start-up')] %}
              {% endif %}
              {% set allday = evs | selectattr('all_day') | list %}
              {% set timed = evs | rejectattr('all_day') | list %}
              {% for e in allday + timed %}
                {% set started = as_timestamp(e.start, nowts) %}
                {% if e.all_day or nowts - started < 3600 %}
                  {% set who = '' if e.who in ['House', ''] else ' (' ~ e.who ~ ')' %}
                  {% set ns.lines = ns.lines + [(e.at if e.at else 'All day') ~ ' ' ~ e.what ~ who] %}
                {% endif %}
              {% endfor %}
              {{ ns.lines[:24] if ns.lines else ['Nothing on today'] }}
            {% endif %}
    sensor:
      - name: Panel today
        unique_id: panel_today
        icon: mdi:calendar-today
        state: >-
          {% set ns = namespace(out=[], more=0) %}
          {% for l in today_lines %}
            {% if (ns.out + [l]) | join('\n') | length <= 230 %}
              {% set ns.out = ns.out + [l] %}
            {% else %}
              {% set ns.more = ns.more + 1 %}
            {% endif %}
          {% endfor %}
          {{ (ns.out + (['+' ~ ns.more ~ ' more'] if ns.more else [])) | join('\n') }}
        attributes:
          lines: "{{ today_lines | join('\n') }}"

  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    action:
      - variables:
          # One line per child from the card's lunch sensors (README, "The
          # lunch attributes") and, for a child with a timetable sensor
          # (README, "The timetable attribute"), today's lessons; then
          # today's kit from sensor.family_kit.
          #   lunch      the child's lunch sensor (menu attribute), or ''
          #   choice     an input_select whose option contains "Packed", or ''
          #   timetable  the child's timetable sensor (timetable attribute), or ''
          kids:
            - { name: Kid A, lunch: sensor.kid_a_lunch, choice: "", timetable: sensor.kid_a_timetable }
            - { name: Kid B, lunch: sensor.kid_b_lunch, choice: input_select.kid_b_lunch, timetable: "" }
          kit_src: sensor.family_kit
          lunch_lines: >-
            {% set today = now().date() %}
            {% set key = today.isoformat() %}
            {% set dkey = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][today.weekday()] %}
            {% set ns = namespace(lines=[]) %}
            {% if today.weekday() >= 5 %}
              {% set ns.lines = ['No school today'] %}
            {% else %}
              {% for k in kids %}
                {% if k.lunch %}
                  {% set menu = state_attr(k.lunch, 'menu') %}
                  {% if menu is string %}{% set menu = menu | from_json %}{% endif %}
                  {% set c = states(k.choice) | lower if k.choice else '' %}
                  {% set day = menu.get(key) if menu is mapping else none %}
                  {% if 'packed' in c %}
                    {% set what = 'packed lunch' %}
                  {% elif menu is not mapping %}
                    {% set what = 'lunch unavailable' %}
                  {% elif day is none or day.status | default('') == 'no_menu' %}
                    {% set what = 'no menu today' %}
                  {% elif day.status | default('') == 'closed' %}
                    {% set what = 'no school' ~ (' (' ~ day.note ~ ')' if day.note is defined and day.note else '') %}
                  {% else %}
                    {% set first = (day.options | default([]) | first) if day.options | default([]) | count else '' %}
                    {% set first = first.name if first is mapping else first %}
                    {% set what = day.choice if day.choice is defined and day.choice else first or 'no menu today' %}
                  {% endif %}
                  {% set ns.lines = ns.lines + [k.name ~ ': ' ~ what] %}
                {% endif %}
                {% if k.timetable %}
                  {% set t = state_attr(k.timetable, 'timetable') %}
                  {% if t is string %}{% set t = t | from_json %}{% endif %}
                  {% if t is not mapping %}
                    {% set ns.lines = ns.lines + [k.name ~ ' lessons unavailable'] %}
                  {% else %}
                    {# Which week runs from this Monday, as the card works it out:
                       a week_of entry for this Monday wins (null is a week off);
                       otherwise count whole weeks on from the latest anchor or
                       week_of entry before it. #}
                    {% set mon = today - timedelta(days=today.weekday()) %}
                    {% set days = t.days if t.days is mapping else {} %}
                    {% set weeks = (t.weeks if t.weeks is sequence and t.weeks is not string and t.weeks | count else days.keys() | list) | map('string') | list %}
                    {% set wo = namespace(m={}) %}
                    {% for wk, wv in (t.week_of if t.week_of is mapping else {}).items() %}
                      {% set wd = as_datetime(wk | string) %}
                      {% if wd %}
                        {% set wd = wd.date() %}
                        {% set wo.m = dict(wo.m, **{(wd - timedelta(days=wd.weekday())).isoformat(): (none if wv is none or wv == '' else wv | string)}) %}
                      {% endif %}
                    {% endfor %}
                    {% set w = namespace(week=none, off=false, at=none, i=0) %}
                    {% if mon.isoformat() in wo.m %}
                      {% set w.week = wo.m[mon.isoformat()] %}
                      {% set w.off = w.week is none %}
                    {% elif weeks | count == 1 %}
                      {% set w.week = weeks[0] %}
                    {% elif weeks | count %}
                      {% set refs = namespace(l=[]) %}
                      {% set ad = as_datetime(t.anchor | default('') | string) %}
                      {% if ad %}{% set ad = ad.date() %}{% set refs.l = refs.l + [{'at': ad - timedelta(days=ad.weekday()), 'i': 0}] %}{% endif %}
                      {% for wk, wv in wo.m.items() if wv in weeks %}
                        {% set refs.l = refs.l + [{'at': as_datetime(wk).date(), 'i': weeks.index(wv)}] %}
                      {% endfor %}
                      {% set before = refs.l | selectattr('at', 'le', mon) | sort(attribute='at', reverse=true) | list %}
                      {% set ref = before[0] if before else (refs.l | sort(attribute='at') | first) %}
                      {% if ref %}
                        {% set w.week = weeks[(ref.i + ((mon - ref.at).days // 7)) % (weeks | count)] %}
                      {% endif %}
                    {% endif %}
                    {% set cl = namespace(hit=false, note='') %}
                    {% for c in t.closed if t.closed is sequence and t.closed is not string %}
                      {% if ((c.date if c is mapping else c) | string) == key %}
                        {% set cl.hit = true %}
                        {% set cl.note = (c.note | default('')) if c is mapping else '' %}
                      {% endif %}
                    {% endfor %}
                    {% set wdays = days.get(w.week, {}) if w.week is not none else {} %}
                    {% set ls = namespace(names=[]) %}
                    {% for dk, dl in (wdays.items() if wdays is mapping else []) if (dk | string | lower)[:3] == dkey and dl is sequence %}
                      {% for l in dl %}
                        {% set s = (l.split('|')[0] if l is string else (l.subject | default('') if l is mapping else '')) | trim %}
                        {% if s %}{% set ls.names = ls.names + [s] %}{% endif %}
                      {% endfor %}
                    {% endfor %}
                    {% if cl.hit or w.off %}
                      {% set ns.lines = ns.lines + [k.name ~ ': no school' ~ (' (' ~ cl.note ~ ')' if cl.note else '')] %}
                    {% elif w.week is none %}
                      {% set ns.lines = ns.lines + [k.name ~ ' lessons unavailable (no week to count from)'] %}
                    {% elif ls.names %}
                      {% set ns.lines = ns.lines + [k.name ~ ' lessons: ' ~ ls.names | join(', ')] %}
                    {% else %}
                      {% set ns.lines = ns.lines + [k.name ~ ': no lessons today'] %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set kit = state_attr(kit_src, 'kit_today') %}
            {% if states(kit_src) in ['unknown', 'unavailable'] %}
              {% set ns.lines = ns.lines + ['Kit unavailable (' ~ kit_src ~ ')'] %}
            {% elif kit and kit != 'none' %}
              {% set ns.lines = ns.lines + ['Kit: ' ~ kit] %}
            {% endif %}
            {{ ns.lines if ns.lines else ['Nothing today'] }}
    sensor:
      - name: Panel lunch and kit
        unique_id: panel_lunch_kit
        icon: mdi:food-apple
        state: >-
          {% set ns = namespace(out=[], more=0) %}
          {% for l in lunch_lines %}
            {% if (ns.out + [l]) | join('\n') | length <= 230 %}
              {% set ns.out = ns.out + [l] %}
            {% else %}
              {% set ns.more = ns.more + 1 %}
            {% endif %}
          {% endfor %}
          {{ (ns.out + (['+' ~ ns.more ~ ' more'] if ns.more else [])) | join('\n') }}
        attributes:
          lines: "{{ lunch_lines | join('\n') }}"

  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    action:
      - variables:
          # From the card's due row sensor (README, "Due times"): anything
          # overdue or due in the next 18 hours, soonest first. Point due_src
          # at yours if it is not sensor.due_times.
          due_src: sensor.due_times
          due_lines: >-
            {% set items = state_attr(due_src, 'items') %}
            {% if items is string %}{% set items = items | from_json %}{% endif %}
            {% if states(due_src) in ['unknown', 'unavailable'] or items is none %}
              {{ ['Due times unavailable (' ~ due_src ~ ')'] }}
            {% else %}
              {% set nowts = as_timestamp(now()) %}
              {% set ns = namespace(rows=[], skipped=0) %}
              {% for i in items if i is mapping %}
                {% set d = i.due | default('') | string %}
                {% set ts = none %}
                {% if d is match('^\d{1,2}:\d{2}$') %}
                  {% set hm = d.split(':') %}
                  {% if hm[0] | int < 24 and hm[1] | int < 60 %}{% set ts = as_timestamp(today_at(d)) %}{% endif %}
                {% elif d is match('^\d{4}-\d{2}-\d{2}$') %}
                  {% set ts = as_timestamp(d ~ 'T23:59:00', none) %}
                {% else %}
                  {% set ts = as_timestamp(d, none) %}
                {% endif %}
                {% if ts is none or not i.label | default('') %}
                  {% set ns.skipped = ns.skipped + 1 %}
                {% elif ts - nowts <= 18 * 3600 %}
                  {% set ns.rows = ns.rows + [{'ts': ts, 'label': i.label, 'who': i.person | default(''), 'dated': 'T' not in d and ':' not in d}] %}
                {% endif %}
              {% endfor %}
              {% set ns2 = namespace(lines=[]) %}
              {% for r in ns.rows | sort(attribute='ts') %}
                {% set when = 'late' if r.ts < nowts else ('today' if r.dated else r.ts | timestamp_custom('%H:%M')) %}
                {% set ns2.lines = ns2.lines + [when ~ ' ' ~ r.label ~ (' (' ~ r.who ~ ')' if r.who else '')] %}
              {% endfor %}
              {% if ns.skipped %}{% set ns2.lines = ns2.lines + [ns.skipped ~ ' item(s) could not be read'] %}{% endif %}
              {{ ns2.lines[:24] if ns2.lines else ['Nothing due soon'] }}
            {% endif %}
    sensor:
      - name: Panel due
        unique_id: panel_due
        icon: mdi:clock-alert-outline
        # The unreadable count is the last line; keep it when cutting to fit.
        state: >-
          {% set ns = namespace(out=[], more=0) %}
          {% set tail = due_lines[-1:] if due_lines[-1] is search('could not be read') else [] %}
          {% for l in (due_lines[:-1] if tail else due_lines) %}
            {% if (ns.out + [l] + tail) | join('\n') | length <= 230 %}
              {% set ns.out = ns.out + [l] %}
            {% else %}
              {% set ns.more = ns.more + 1 %}
            {% endif %}
          {% endfor %}
          {{ (ns.out + (['+' ~ ns.more ~ ' more'] if ns.more else []) + tail) | join('\n') }}
        attributes:
          lines: "{{ due_lines | join('\n') }}"
